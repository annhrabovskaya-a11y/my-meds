*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Alegreya Sans",system-ui,-apple-system,sans-serif;font-size:17px}
html{background:var(--bg)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh;
  background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,#8a6a400a 3px 4px),repeating-linear-gradient(90deg,transparent 0 3px,#8a6a400a 3px 4px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.band{height:34px;background:var(--band) repeat-x center/auto 34px;margin:0 0 4px}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 2px 14px}
.ttl{display:flex;align-items:center;gap:10px}
h1{font-family:Alegreya,Georgia,serif;font-size:32px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1}
.date{color:var(--muted);font-size:15px;margin-top:4px;font-style:italic}
.sync{flex:none;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
h2{font-family:Alegreya,Georgia,serif;font-size:19px;font-weight:700;color:var(--accent);margin:28px 4px 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:9px;height:9px;background:var(--accent);transform:rotate(45deg);flex:none;box-shadow:13px -0px 0 -2px var(--ink)}
h2::after{content:"";flex:1;height:5px;background:var(--stitch);opacity:.35;border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 8px 22px -16px #5a3a1a55;position:relative;overflow:hidden}
.card.med{padding-top:20px}
.card.med::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:4px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 12px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.name{font-family:Alegreya,Georgia,serif;font-weight:800;font-size:21px;line-height:1.15}
.sub{color:var(--muted);font-size:15px}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:14px;height:14px;position:relative;display:inline-block;flex:none}
.dot::before,.dot::after{content:"";position:absolute;left:50%;top:50%;width:17px;height:4px;border-radius:2px;background:var(--c);opacity:.22;transform:translate(-50%,-50%) rotate(45deg)}
.dot::after{transform:translate(-50%,-50%) rotate(-45deg)}
.dot.on::before,.dot.on::after{opacity:1}
.count{font-size:14px;color:var(--muted);font-weight:700}
.lines{margin:12px 0 14px;display:grid;gap:6px;font-size:16px}
.lines b{font-weight:800}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px}
.tag.due{background:var(--due-soft);color:#7c4f08}
.tag.ok{background:#E3ECDD;color:var(--green)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:8px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:800;padding:13px 18px;border-radius:12px;flex:1;font-size:17px;transition:transform .08s;box-shadow:inset 0 -3px 0 #0000002e}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#EDE1CE;color:var(--ink);flex:0 0 auto;box-shadow:inset 0 -2px 0 #0000001a}
.btn.small{padding:9px 14px;font-size:15px;border-radius:11px;flex:0 0 auto}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.done{background:var(--green)}
.link{color:var(--accent);font-weight:800;font-size:15px;padding:6px 2px}
.empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:17px}
.empty .big{margin-bottom:10px}
.combo{display:flex;align-items:center;gap:12px}
.combo .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,#FFFCF6);color:color-mix(in srgb,var(--c) 75%,black)}
.day{margin-bottom:8px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px}
.dayhead b{font-family:Alegreya,Georgia,serif;font-size:18px}
.timeline{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 0;box-shadow:0 8px 22px -16px #5a3a1a55}
.ev{display:grid;grid-template-columns:56px 14px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev .t{font-weight:800;font-variant-numeric:tabular-nums}
.ev .d{width:10px;height:10px;background:var(--c);transform:rotate(45deg);border-radius:1px}
.ev .gap{font-size:14px;color:var(--muted)}
.ev .x{color:var(--muted);font-size:20px;padding:4px 8px;border-radius:10px}
.ev .x.confirm{background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:800}
.filter{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.fbtn{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px}
.fbtn.on{background:var(--ink);color:#FFF8EE;border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:Alegreya,Georgia,serif;font-size:21px}
.stat span{font-size:13px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:#FFFCF6f2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;padding:12px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--stitch)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:13px;font-weight:700;color:var(--muted);border-radius:12px}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--accent);background:var(--accent-soft)}
.veil{position:fixed;inset:0;background:#2b232070;z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.grab{height:26px;background:var(--band) repeat-x center/auto 26px;margin:0 -18px 14px}
.sheet h3{font-family:Alegreya,Georgia,serif;margin:4px 0 16px;font-size:24px;font-weight:800}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:5px 2px 0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--card);box-shadow:0 0 0 2px var(--c)}
.checks{display:grid;gap:8px}
.check{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#FFF8EE;padding:11px 16px;border-radius:12px;font-weight:700;font-size:15px;z-index:20;display:flex;gap:14px;align-items:center;animation:up .2s;max-width:92vw}
.toast button{color:#E9B35A;font-weight:800}
.notice{font-size:14px;color:var(--muted);background:var(--card);border:1px dashed #d6c4a8;border-radius:14px;padding:12px;margin-top:22px;line-height:1.45}
.foot{display:flex;justify-content:center;margin-top:30px;opacity:.9}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <header>
    <div class="ttl"><span id="flw"></span><div><h1 id="title">Сьогодні</h1><div class="date" id="today"></div></div></div>
    
  </header>
  <main id="main"></main>
</div>
<nav><div class="in">
  <button data-tab="today" class="on"><span class="i">💊</span>Сьогодні</button>
  <button data-tab="history"><span class="i">🕘</span>Історія</button>
  <button data-tab="meds"><span class="i">⚙️</span>Мої ліки</button>
</div></nav>

<script>
/* ---------- helpers ---------- */
const COLORS=["#A8231C","#2B2320","#3F6B3A","#C8902E","#2F4F7F","#7A1F2B","#B5562E","#6F7A2E"];
function flower(sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" aria-hidden="true">
<path d="M32 62C32 50 31 42 32 34" stroke="#3F6B3A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<path d="M31 50C22 49 14 42 12 34C21 35 28 41 31 50Z" fill="#3F6B3A"/><path d="M33 46C41 46 49 40 52 32C43 32 36 38 33 46Z" fill="#5A8A4E"/>
<path d="M17 41C20 40 24 41 26 43" stroke="#FFFCF6" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<g transform="translate(32 22)">${[0,72,144,216,288].map(a=>`<path transform="rotate(${a})" d="M0 -3C-7 -8 -7 -18 0 -21C7 -18 7 -8 0 -3Z" fill="#A8231C"/><path transform="rotate(${a})" d="M0 -6C-2.5 -9 -2.5 -14 0 -16C2.5 -14 2.5 -9 0 -6Z" fill="#E0663F"/>`).join("")}
<circle r="6" fill="#C8902E"/><circle r="2.6" fill="#2B2320"/></g>
<circle cx="10" cy="22" r="2.6" fill="#A8231C"/><circle cx="7" cy="27" r="2" fill="#2B2320"/><circle cx="54" cy="22" r="2.6" fill="#A8231C"/><circle cx="57" cy="27" r="2" fill="#2B2320"/></svg>`}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const HOUR=3600e3;
const fmtTime=ts=>new Date(ts).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
const fmtDay=ts=>{
  const d=new Date(ts), t=new Date(); const y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "Сьогодні";
  if(d.toDateString()===y.toDateString()) return "Вчора";
  return d.toLocaleDateString("uk-UA",{weekday:"long",day:"numeric",month:"long"});
};
function fmtDur(ms){
  ms=Math.abs(ms); const m=Math.round(ms/60000);
  if(m<1) return "щойно";
  const h=Math.floor(m/60), mm=m%60;
  if(h>=48) return Math.floor(h/24)+" дн "+(h%24)+" год";
  return [h?h+" год":"",(mm||!h)?mm+" хв":""].filter(Boolean).join(" ");
}
const startOfDay=(ts=Date.now())=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const toLocalInput=ts=>{const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
function pieces(n){n=+n; if(Number.isInteger(n)) return n+" шт"; return n.toFixed(1).replace(".",",")+" шт"}

/* ---------- state & storage ---------- */
const S={meds:{},doses:{},combos:{}};
const KIND={med:"meds",dose:"doses",combo:"combos"};
let backend=null, col=null; const queues={};
const LS="mylikiv1";

function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){Object.assign(S,j)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

function put(kind,obj){
  S[KIND[kind]][obj.id]=obj; render();
  if(backend==="db"){ queue(obj.id,()=>col.doc(obj.id).set({...obj,kind})) } else saveLocal();
}
function del(kind,id){
  delete S[KIND[kind]][id]; render();
  if(backend==="db"){ queue(id,()=>col.doc(id).delete()) } else saveLocal();
}
function queue(id,fn){
  queues[id]=(queues[id]||Promise.resolve()).then(fn).catch(e=>{console.warn(e);toast("Не вдалося зберегти. Перевірте інтернет.")});
}
function applySnapshot(snap){
  const docs=snap&&(snap.docs||snap)||[];
  const next={meds:{},doses:{},combos:{}};
  (Array.isArray(docs)?docs:[]).forEach(d=>{
    const data=typeof d.data==="function"?d.data():(d.data||d);
    const id=d.id||data.id; if(!data||!KIND[data.kind]) return;
    next[KIND[data.kind]][id]={...data,id};
  });
  Object.assign(S,next); render();
}
function setSync(t){const e=$("#sync");if(e)e.textContent=t}

async function initStorage(){
  backend="local"; loadLocal(); render();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(e){}
}

/* ---------- derived ---------- */
const medsList=()=>Object.values(S.meds).sort((a,b)=>(a.order||a.created)-(b.order||b.created));
const dosesOf=id=>Object.values(S.doses).filter(d=>d.medId===id).sort((a,b)=>b.at-a.at);
function interval(m){ if(+m.interval>0) return +m.interval; return m.times>0? 24/m.times : 0 }
function medStatus(m){
  const ds=dosesOf(m.id), last=ds[0], now=Date.now();
  const today=ds.filter(d=>d.at>=startOfDay()).length;
  const iv=interval(m);
  let next=null; if(last&&iv) next=last.at+iv*HOUR;
  const perDay=(+m.perDose||1)*(+m.times||0);
  const daysLeft=perDay? (+m.stock||0)/perDay : null;
  return {last,today,next,iv,daysLeft,now};
}

/* ---------- render ---------- */
let tab="today", histFilter="all", pendingDelete=null;
function render(){
  $("#today").textContent=new Date().toLocaleDateString("uk-UA",{weekday:"short",day:"numeric",month:"long"});
  $("#title").textContent={today:"Сьогодні",history:"Історія",meds:"Мої ліки"}[tab];
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  $("#main").innerHTML= backend===null? `<div class="empty">Завантаження…</div>` :
    tab==="today"?renderToday(): tab==="history"?renderHistory(): renderMeds();
}

function renderToday(){
  const meds=medsList();
  if(!meds.length) return `<div class="empty"><div class="big">${flower(96)}</div>Тут з'являться ваші ліки.<br><br>
    <button class="btn" style="flex:none" onclick="openMedForm()">Додати перші ліки</button></div>`;
  let h="";
  const combos=Object.values(S.combos);
  if(combos.length){
    h+=`<h2>Комбінації</h2>`;
    combos.forEach(c=>{
      const ms=c.medIds.map(id=>S.meds[id]).filter(Boolean);
      h+=`<div class="card combo"><div style="flex:1;min-width:0"><div class="name">${esc(c.name)}</div>
        <div class="chips">${ms.map(m=>`<span class="chip" style="--c:${m.color}">${esc(m.name)}</span>`).join("")}</div></div>
        <div class="actions" style="flex-direction:column">
          <button class="btn small" onclick="takeCombo('${c.id}')">Випила все</button>
          <button class="link" onclick="openTimeSheet('combo','${c.id}')">інший час</button></div></div>`;
    });
    h+=`<h2>Ліки</h2>`;
  }
  meds.forEach(m=>{
    const st=medStatus(m);
    const times=+m.times||0;
    let dots="";
    if(times>0){ for(let i=0;i<Math.max(times,st.today);i++) dots+=`<span class="dot ${i<st.today?"on":""}"></span>` }
    let nextLine="";
    if(!st.last) nextLine=`<span class="sub">Ще не приймали</span>`;
    else if(st.next){
      const diff=st.next-st.now;
      if(times>0 && st.today>=times && diff>0 && new Date(st.next).getDate()!==new Date().getDate())
        nextLine=`<span class="tag ok">✓ На сьогодні все</span>`;
      else if(diff<=0) nextLine=`<span class="tag due">Час приймати · з ${fmtTime(st.next)}</span>`;
      else nextLine=`Наступна о <b>${fmtTime(st.next)}</b> <span class="sub">(через ${fmtDur(diff)})</span>`;
    }
    let stock="";
    if(m.stock!==""&&m.stock!=null){
      const low=(+m.stock<(+m.perDose||1))||(st.daysLeft!=null&&st.daysLeft<=5);
      stock=`<div>${low?'<span class="tag warn">':''}Залишилось ${pieces(m.stock)}${st.daysLeft!=null?` · ≈ ${Math.floor(st.daysLeft)} дн`:''}${low?'</span>':''}</div>`;
    }
    h+=`<div class="card med" style="--c:${m.color}">
      <div class="row between"><div><div class="name">${esc(m.name)}</div>
        <div class="sub">${esc([m.dose, times?`${times} р/день`:"за потреби"].filter(Boolean).join(" · "))}</div></div>
        ${times?`<div style="text-align:right"><div class="dots">${dots}</div><div class="count" style="margin-top:4px">${st.today} з ${times}</div></div>`:`<div class="count">сьогодні: ${st.today}</div>`}
      </div>
      <div class="lines">
        ${st.last?`<div>Остання: <b>${fmtTime(st.last.at)}</b>${st.last.at<startOfDay()?` <span class="sub">(${fmtDay(st.last.at).toLowerCase()})</span>`:""} <span class="sub">· ${fmtDur(st.now-st.last.at)} тому</span></div>`:""}
        <div>${nextLine}</div>
        ${stock}
      </div>
      <div class="actions">
        <button class="btn" id="take_${m.id}" onclick="takeMed('${m.id}')">✓ Випила</button>
        <button class="btn ghost" onclick="openTimeSheet('med','${m.id}')" aria-label="Вказати інший час">🕒</button>
      </div></div>`;
  });
  return h;
}

function renderHistory(){
  const meds=medsList();
  let doses=Object.values(S.doses).sort((a,b)=>b.at-a.at);
  if(histFilter!=="all") doses=doses.filter(d=>d.medId===histFilter);
  let h=`<div class="filter"><button class="fbtn ${histFilter==="all"?"on":""}" onclick="setFilter('all')">Усі</button>
    ${meds.map(m=>`<button class="fbtn ${histFilter===m.id?"on":""}" onclick="setFilter('${m.id}')">${esc(m.name)}</button>`).join("")}</div>`;
  if(histFilter!=="all"){
    const m=S.meds[histFilter], ds=doses;
    const gaps=[]; for(let i=0;i<ds.length-1;i++) gaps.push(ds[i].at-ds[i+1].at);
    const avg=gaps.length? gaps.reduce((a,b)=>a+b,0)/gaps.length:null;
    const week=ds.filter(d=>d.at>=Date.now()-7*24*HOUR).length;
    h+=`<div class="stats"><div class="stat"><b>${week}</b><span>за 7 днів</span></div>
      <div class="stat"><b>${avg?fmtDur(avg):"—"}</b><span>сер. інтервал</span></div>
      <div class="stat"><b>${m&&m.times?interval(m).toString().replace(".",",")+" год":"—"}</b><span>за схемою</span></div></div>`;
  }
  if(!doses.length) return h+`<div class="empty"><div class="big">${flower(80)}</div>Поки що порожньо.<br>Записи з'являться після першої відмітки «Випила».</div>`;
  // previous dose of same med for intervals
  const all=Object.values(S.doses).sort((a,b)=>a.at-b.at), prev={}, lastSeen={};
  all.forEach(d=>{prev[d.id]=lastSeen[d.medId]; lastSeen[d.medId]=d});
  const groups={};
  doses.forEach(d=>{const k=startOfDay(d.at);(groups[k]=groups[k]||[]).push(d)});
  Object.keys(groups).sort((a,b)=>b-a).forEach(k=>{
    const list=groups[k];
    h+=`<div class="day"><div class="dayhead"><b>${fmtDay(+k)}</b><span class="sub">${list.length} ${plural(list.length,"прийом","прийоми","прийомів")}</span></div><div class="timeline">`;
    list.forEach(d=>{
      const m=S.meds[d.medId]; const color=m?m.color:(d.color||"#999"); const name=m?m.name:(d.medName+" (видалено)");
      const p=prev[d.id];
      const gap=p?`+${fmtDur(d.at-p.at)} після попередньої`:"перший запис";
      const combo=d.comboId&&S.combos[d.comboId]?` · ${esc(S.combos[d.comboId].name)}`:"";
      h+=`<div class="ev" style="--c:${color}"><span class="t">${fmtTime(d.at)}</span><span class="d"></span>
        <div><div style="font-weight:700">${esc(name)}${d.amount&&d.amount!=1?` <span class="sub">×${d.amount}</span>`:""}</div><div class="gap">${gap}${combo}${d.note?` · ${esc(d.note)}`:""}</div></div>
        <button class="x ${pendingDelete===d.id?"confirm":""}" onclick="askDelete('${d.id}')">${pendingDelete===d.id?"Видалити?":"×"}</button></div>`;
    });
    h+=`</div></div>`;
  });
  return h;
}

function renderMeds(){
  const meds=medsList(); const combos=Object.values(S.combos);
  let h=`<button class="btn" style="width:100%" onclick="openMedForm()">+ Додати ліки</button>`;
  if(meds.length){
    h+=`<h2>Ліки</h2>`;
    meds.forEach(m=>{
      h+=`<div class="card med" style="--c:${m.color}"><div class="row between"><div>
        <div class="name">${esc(m.name)}</div>
        <div class="sub">${esc([m.dose, m.times?`${m.times} р/день · кожні ${String(interval(m)).replace(".",",")} год`:"за потреби", m.stock!==""&&m.stock!=null?`запас ${pieces(m.stock)}`:""].filter(Boolean).join(" · "))}</div>
        ${m.notes?`<div class="sub" style="margin-top:4px">📝 ${esc(m.notes)}</div>`:""}</div>
        <div class="row" style="gap:4px"><button class="btn small ghost" onclick="openRefill('${m.id}')">＋📦</button>
        <button class="btn small ghost" onclick="openMedForm('${m.id}')">Змінити</button></div></div></div>`;
    });
    h+=`<h2>Комбінації</h2><p class="sub" style="margin:-4px 4px 10px">Набір ліків, які п'єте разом — одна кнопка відмічає всі.</p>`;
    combos.forEach(c=>{
      const ms=c.medIds.map(id=>S.meds[id]).filter(Boolean);
      h+=`<div class="card"><div class="row between"><div><div class="name">${esc(c.name)}</div>
        <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${ms.map(m=>`<span class="chip" style="--c:${m.color}">${esc(m.name)}</span>`).join("")}</div></div>
        <button class="btn small ghost" onclick="openComboForm('${c.id}')">Змінити</button></div></div>`;
    });
    if(meds.length>1) h+=`<button class="btn ghost" style="width:100%" onclick="openComboForm()">+ Нова комбінація</button>`;
    else h+=`<p class="sub" style="margin:0 4px">Додайте хоча б двоє ліків, щоб створити комбінацію.</p>`;
  }
  let lb=0; try{lb=+(localStorage.getItem(BK)||0)}catch(e){}
  const stale=Object.keys(S.doses).length&&(!lb||Date.now()-lb>14*24*HOUR);
  h+=`<h2>Резервна копія</h2><div class="card">
    <div class="row between"><b>${lb?`Остання: ${fmtDay(lb).toLowerCase()}, ${fmtTime(lb)}`:"Копій ще не було"}</b>${stale?'<span class="tag warn">Час зберегти</span>':''}</div>
    <p class="sub" style="margin:8px 0 14px">Дані зберігаються лише на цьому телефоні. Час від часу зберігайте копію (у «Файли», iCloud, на пошту), щоб не втратити історію.</p>
    <div class="actions"><button class="btn" onclick="saveBackup()">Зберегти копію</button><button class="btn ghost" onclick="openRestore()">Відновити</button></div></div>`;
  h+=`<div class="foot">${flower(56)}</div><div class="notice" style="margin-top:10px">Додаток лише записує, що і коли ви прийняли. Про сумісність ліків і дозування питайте лікаря або фармацевта.</div>`;
  return h;
}
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14)?b:c)};

/* ---------- actions ---------- */
function logDose(medId,at,extra={}){
  const m=S.meds[medId]; if(!m) return;
  const amount=+m.perDose||1;
  const d={id:uid("d"),medId,at,amount,medName:m.name,color:m.color,...extra};
  put("dose",d);
  if(m.stock!==""&&m.stock!=null) put("med",{...m,stock:Math.max(0,+(+m.stock-amount).toFixed(2))});
  return d;
}
function takeMed(id,at=Date.now(),note=""){
  const d=logDose(id,at,note?{note}:{});
  const b=document.getElementById("take_"+id); if(b){b.classList.add("done");b.textContent="✓ Записано"}
  toast(`${esc(S.meds[id].name)} — ${fmtTime(at)}`,()=>undoDoses([d.id]));
}
function takeCombo(cid,at=Date.now(),note=""){
  const c=S.combos[cid]; if(!c) return;
  const ids=c.medIds.filter(id=>S.meds[id]).map(id=>logDose(id,at,{comboId:cid,...(note?{note}:{})}).id);
  toast(`${esc(c.name)}: ${ids.length} ${plural(ids.length,"препарат","препарати","препаратів")} о ${fmtTime(at)}`,()=>undoDoses(ids));
}
function undoDoses(ids){
  ids.forEach(id=>{const d=S.doses[id]; if(!d) return; const m=S.meds[d.medId];
    if(m&&m.stock!==""&&m.stock!=null) put("med",{...m,stock:+(+m.stock+(+d.amount||1)).toFixed(2)});
    del("dose",id)});
  toast("Скасовано");
}
function askDelete(id){
  if(pendingDelete===id){pendingDelete=null; undoDoses([id]); return}
  pendingDelete=id; render(); setTimeout(()=>{if(pendingDelete===id){pendingDelete=null;render()}},3500);
}
function setFilter(f){histFilter=f;render()}

/* ---------- sheets ---------- */
function openSheet(html){
  closeSheet();
  const v=document.createElement("div"); v.className="veil"; v.id="veil";
  v.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  v.addEventListener("click",e=>{if(e.target===v)closeSheet()});
  document.body.appendChild(v); return v;
}
function closeSheet(){const v=$("#veil"); if(v) v.remove()}

function openMedForm(id){
  const m=id?S.meds[id]:{name:"",dose:"",times:2,interval:"",stock:"",perDose:1,color:COLORS[medsList().length%COLORS.length],notes:""};
  const v=openSheet(`<h3>${id?"Змінити ліки":"Нові ліки"}</h3>
  <form id="mf">
    <label class="f"><span>Назва</span><input class="inp" name="name" required value="${esc(m.name)}" placeholder="напр. Магній B6"></label>
    <label class="f"><span>Доза (необов'язково)</span><input class="inp" name="dose" value="${esc(m.dose)}" placeholder="напр. 500 мг"></label>
    <div class="grid2">
      <label class="f"><span>Разів на день</span><input class="inp" name="times" type="number" min="0" max="24" inputmode="numeric" value="${esc(m.times)}"></label>
      <label class="f"><span>Інтервал, год</span><input class="inp" name="interval" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(m.interval)}" placeholder="авто"></label>
    </div>
    <p class="hint" style="margin-top:-8px;margin-bottom:14px">0 разів = «за потреби». Інтервал порожній — рахується як 24 ÷ разів на день.</p>
    <div class="grid2">
      <label class="f"><span>Скільки пігулок є</span><input class="inp" name="stock" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(m.stock)}" placeholder="напр. 30"></label>
      <label class="f"><span>Пігулок за раз</span><input class="inp" name="perDose" type="number" min="0.25" step="0.25" inputmode="decimal" value="${esc(m.perDose)}"></label>
    </div>
    <label class="f"><span>Колір</span><div class="swatches">${COLORS.map(c=>`<button type="button" class="sw ${c===m.color?"on":""}" style="--c:${c}" data-c="${c}"></button>`).join("")}</div></label>
    <label class="f"><span>Нотатка</span><input class="inp" name="notes" value="${esc(m.notes)}" placeholder="напр. після їжі"></label>
    <div class="actions" style="margin-top:6px">${id?`<button type="button" class="btn ghost danger" id="delMed">Видалити</button>`:""}<button class="btn">Зберегти</button></div>
  </form>`);
  let color=m.color;
  v.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{color=b.dataset.c;v.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b))});
  const db=v.querySelector("#delMed");
  if(db) db.onclick=()=>{ if(db.dataset.sure){ Object.values(S.combos).forEach(c=>{if(c.medIds.includes(id)) put("combo",{...c,medIds:c.medIds.filter(x=>x!==id)})}); del("med",id); closeSheet(); toast("Ліки видалено. Історія збережена.") } else { db.dataset.sure=1; db.textContent="Точно?" } };
  v.querySelector("#mf").onsubmit=e=>{
    e.preventDefault(); const f=new FormData(e.target);
    const obj={...(id?m:{id:uid("m"),created:Date.now()}),
      name:f.get("name").trim(), dose:f.get("dose").trim(), times:Math.max(0,parseInt(f.get("times")||0)),
      interval:f.get("interval")===""?"":+f.get("interval"), stock:f.get("stock")===""?"":+f.get("stock"),
      perDose:+f.get("perDose")||1, color, notes:f.get("notes").trim()};
    if(!obj.name) return;
    put("med",obj); closeSheet(); toast(id?"Збережено":"Ліки додано");
  };
}

function openRefill(id){
  const m=S.meds[id];
  const v=openSheet(`<h3>Поповнити запас</h3><p class="sub" style="margin-top:-8px">${esc(m.name)} · зараз ${m.stock===""||m.stock==null?"не вказано":pieces(m.stock)}</p>
  <form id="rf"><label class="f"><span>Скільки пігулок додати</span><input class="inp" name="n" type="number" min="0" step="0.5" inputmode="decimal" required autofocus placeholder="напр. 30"></label>
  <button class="btn" style="width:100%">Додати</button></form>`);
  v.querySelector("#rf").onsubmit=e=>{e.preventDefault();const n=+new FormData(e.target).get("n")||0;
    put("med",{...m,stock:+((+m.stock||0)+n).toFixed(2)});closeSheet();toast(`Запас: ${pieces((+m.stock||0)+n)}`)};
}

function openComboForm(id){
  const c=id?S.combos[id]:{name:"",medIds:[]};
  const v=openSheet(`<h3>${id?"Змінити комбінацію":"Нова комбінація"}</h3>
  <form id="cf"><label class="f"><span>Назва</span><input class="inp" name="name" required value="${esc(c.name)}" placeholder="напр. Ранок, Вечір, Після їжі"></label>
  <label class="f"><span>Що входить</span><div class="checks">${medsList().map(m=>`<label class="check"><input type="checkbox" name="m" value="${m.id}" ${c.medIds.includes(m.id)?"checked":""}><span class="dot on" style="--c:${m.color}"></span>${esc(m.name)}</label>`).join("")}</div></label>
  <div class="actions">${id?`<button type="button" class="btn ghost danger" id="delC">Видалити</button>`:""}<button class="btn">Зберегти</button></div></form>`);
  const dc=v.querySelector("#delC"); if(dc) dc.onclick=()=>{ if(dc.dataset.sure){del("combo",id);closeSheet()} else {dc.dataset.sure=1;dc.textContent="Точно?"} };
  v.querySelector("#cf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const ids=f.getAll("m");
    if(!ids.length){toast("Оберіть хоча б одні ліки");return}
    put("combo",{...(id?c:{id:uid("c"),created:Date.now()}),name:f.get("name").trim(),medIds:ids});closeSheet();toast("Комбінацію збережено")};
}

function openTimeSheet(kind,id){
  const label=kind==="med"?S.meds[id].name:S.combos[id].name;
  const v=openSheet(`<h3>Коли прийняли?</h3><p class="sub" style="margin-top:-8px">${esc(label)}</p>
  <form id="tf"><label class="f"><span>Дата і час</span><input class="inp" type="datetime-local" name="at" value="${toLocalInput(Date.now())}" max="${toLocalInput(Date.now()+60000)}"></label>
  <div class="row" style="gap:8px;margin:-4px 0 14px;flex-wrap:wrap">${[15,30,60,120].map(n=>`<button type="button" class="fbtn" data-ago="${n}">${n<60?n+" хв":n/60+" год"} тому</button>`).join("")}</div>
  <label class="f"><span>Нотатка (необов'язково)</span><input class="inp" name="note" placeholder="напр. з їжею"></label>
  <button class="btn" style="width:100%">Записати</button></form>`);
  const inp=v.querySelector("[name=at]");
  v.querySelectorAll("[data-ago]").forEach(b=>b.onclick=()=>{inp.value=toLocalInput(Date.now()-b.dataset.ago*60000)});
  v.querySelector("#tf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    const at=new Date(f.get("at")).getTime()||Date.now(); const note=(f.get("note")||"").trim();
    closeSheet(); kind==="med"?takeMed(id,at,note):takeCombo(id,at,note)};
}

/* ---------- backup ---------- */
const BK="mylikiv1_lastbackup";
function markBackup(){try{localStorage.setItem(BK,Date.now())}catch(e){} toast("Копію збережено"); render()}
async function saveBackup(){
  const txt=JSON.stringify({app:"moi-liky",v:1,savedAt:Date.now(),data:S});
  const name=`moi-liky-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([txt],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Мої ліки — копія"}); return markBackup() } }
  catch(e){ if(e&&e.name==="AbortError") return }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); markBackup();
}
function restoreFrom(text){
  let j; try{j=JSON.parse(text)}catch(e){return toast("Не вдалося прочитати копію")}
  const d=(j&&j.data)||j;
  if(!d||typeof d.meds!=="object") return toast("Це не схоже на копію «Мої ліки»");
  S.meds=d.meds||{}; S.doses=d.doses||{}; S.combos=d.combos||{};
  saveLocal(); closeSheet(); render(); toast("Дані відновлено");
}
function openRestore(){
  const v=openSheet(`<h3>Відновити з копії</h3>
  <p class="sub" style="margin-top:-8px">Поточні дані на цьому телефоні буде замінено даними з копії.</p>
  <label class="f"><span>Файл копії (.json)</span><input class="inp" type="file" accept=".json,application/json,text/plain" id="rfile"></label>
  <label class="f"><span>…або вставте скопійований текст</span><textarea class="inp" id="rtext" rows="4" placeholder="{&quot;app&quot;:&quot;moi-liky&quot; …}"></textarea></label>
  <button class="btn" style="width:100%" id="rgo">Відновити</button>`);
  v.querySelector("#rgo").onclick=async()=>{
    const f=v.querySelector("#rfile").files[0];
    if(f) return restoreFrom(await f.text());
    const t=v.querySelector("#rtext").value.trim();
    if(t) return restoreFrom(t);
    toast("Оберіть файл або вставте текст");
  };
}

/* ---------- toast ---------- */
let tt;
function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(t=>t.remove()); clearTimeout(tt);
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=`<span>${msg}</span>`;
  if(undo){const b=document.createElement("button");b.textContent="Скасувати";b.onclick=()=>{t.remove();undo()};t.appendChild(b)}
  document.body.appendChild(t); tt=setTimeout(()=>t.remove(),undo?5000:2200);
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;pendingDelete=null;closeSheet();render();scrollTo(0,0)});

document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#veil"))render()});
$("#flw").innerHTML=flower(44); render(); initStorage();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
