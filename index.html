*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Alegreya Sans",system-ui,-apple-system,sans-serif;font-size:17px}
html{background:var(--bg)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh;
  background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,#8a6a400a 3px 4px),repeating-linear-gradient(90deg,transparent 0 3px,#8a6a400a 3px 4px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.band{height:34px;background:var(--band) repeat-x center/auto 34px;margin:0 0 4px}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 2px 14px}
.ttl{display:flex;align-items:center;gap:10px}
h1{font-family:Alegreya,Georgia,serif;font-size:32px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1}
.date{color:var(--muted);font-size:15px;margin-top:4px;font-style:italic}
.sync{flex:none;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
h2{font-family:Alegreya,Georgia,serif;font-size:19px;font-weight:700;color:var(--accent);margin:28px 4px 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:9px;height:9px;background:var(--accent);transform:rotate(45deg);flex:none;box-shadow:13px -0px 0 -2px var(--ink)}
h2::after{content:"";flex:1;height:5px;background:var(--stitch);opacity:.35;border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 8px 22px -16px #5a3a1a55;position:relative;overflow:hidden}
.card.med{padding-top:20px}
.card.med::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:4px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 12px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.name{font-family:Alegreya,Georgia,serif;font-weight:800;font-size:21px;line-height:1.15}
.sub{color:var(--muted);font-size:15px}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:14px;height:14px;position:relative;display:inline-block;flex:none}
.dot::before,.dot::after{content:"";position:absolute;left:50%;top:50%;width:17px;height:4px;border-radius:2px;background:var(--c);opacity:.22;transform:translate(-50%,-50%) rotate(45deg)}
.dot::after{transform:translate(-50%,-50%) rotate(-45deg)}
.dot.on::before,.dot.on::after{opacity:1}
.count{font-size:14px;color:var(--muted);font-weight:700}
.lines{margin:12px 0 14px;display:grid;gap:6px;font-size:16px}
.lines b{font-weight:800}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px}
.tag.due{background:var(--due-soft);color:#7c4f08}
.tag.ok{background:#E3ECDD;color:var(--green)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:8px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:800;padding:13px 18px;border-radius:12px;flex:1;font-size:17px;transition:transform .08s;box-shadow:inset 0 -3px 0 #0000002e}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#EDE1CE;color:var(--ink);flex:0 0 auto;box-shadow:inset 0 -2px 0 #0000001a}
.btn.small{padding:9px 14px;font-size:15px;border-radius:11px;flex:0 0 auto}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.done{background:var(--green)}
.link{color:var(--accent);font-weight:800;font-size:15px;padding:6px 2px}
.empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:17px}
.empty .big{margin-bottom:10px}
.combo{display:flex;align-items:center;gap:12px}

</style>

<body>
<div class="band"></div>
<div class="wrap">
  <header>
    <div class="ttl"><span id="flw"></span><div><h1 id="title">Сьогодні</h1><div class="date" id="today"></div></div></div>
    
  </header>
  <main id="main"></main>
</div>
<nav><div class="in">
  <button data-tab="today" class="on"><span class="i">💊</span>Сьогодні</button>
  <button data-tab="plan"><span class="i">🗓️</span>План</button>
  <button data-tab="history"><span class="i">🕘</span>Історія</button>
  <button data-tab="meds"><span class="i">⚙️</span>Мої ліки</button>
</div></nav>

<script>
/* ---------- helpers ---------- */
const COLORS=["#A8231C","#2B2320","#3F6B3A","#C8902E","#2F4F7F","#7A1F2B","#B5562E","#6F7A2E"];
function flower(sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" aria-hidden="true">
<path d="M32 62C32 50 31 42 32 34" stroke="#3F6B3A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<path d="M31 50C22 49 14 42 12 34C21 35 28 41 31 50Z" fill="#3F6B3A"/><path d="M33 46C41 46 49 40 52 32C43 32 36 38 33 46Z" fill="#5A8A4E"/>
<path d="M17 41C20 40 24 41 26 43" stroke="#FFFCF6" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<g transform="translate(32 22)">${[0,72,144,216,288].map(a=>`<path transform="rotate(${a})" d="M0 -3C-7 -8 -7 -18 0 -21C7 -18 7 -8 0 -3Z" fill="#A8231C"/><path transform="rotate(${a})" d="M0 -6C-2.5 -9 -2.5 -14 0 -16C2.5 -14 2.5 -9 0 -6Z" fill="#E0663F"/>`).join("")}
<circle r="6" fill="#C8902E"/><circle r="2.6" fill="#2B2320"/></g>
<circle cx="10" cy="22" r="2.6" fill="#A8231C"/><circle cx="7" cy="27" r="2" fill="#2B2320"/><circle cx="54" cy="22" r="2.6" fill="#A8231C"/><circle cx="57" cy="27" r="2" fill="#2B2320"/></svg>`}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const HOUR=3600e3;
const fmtTime=ts=>new Date(ts).toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
const fmtDay=ts=>{
  const d=new Date(ts), t=new Date(); const y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "Сьогодні";
  if(d.toDateString()===y.toDateString()) return "Вчора";
  return d.toLocaleDateString("uk-UA",{weekday:"long",day:"numeric",month:"long"});
};
function fmtDur(ms){
  ms=Math.abs(ms); const m=Math.round(ms/60000);
  if(m<1) return "щойно";
  const h=Math.floor(m/60), mm=m%60;
  if(h>=48) return Math.floor(h/24)+" дн "+(h%24)+" год";
  return [h?h+" год":"",(mm||!h)?mm+" хв":""].filter(Boolean).join(" ");
}
const startOfDay=(ts=Date.now())=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const toLocalInput=ts=>{const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
function pieces(n){n=+n; if(Number.isInteger(n)) return n+" шт"; return n.toFixed(1).replace(".",",")+" шт"}

/* ---------- state & storage ---------- */
const S={meds:{},doses:{},combos:{}};
const KIND={med:"meds",dose:"doses",combo:"combos"};
let backend=null, col=null; const queues={};
const LS="mylikiv1";

function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){Object.assign(S,j)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

function put(kind,obj){
  S[KIND[kind]][obj.id]=obj; render();
  if(backend==="db"){ queue(obj.id,()=>col.doc(obj.id).set({...obj,kind})) } else saveLocal();
}
function del(kind,id){
  delete S[KIND[kind]][id]; render();
  if(backend==="db"){ queue(id,()=>col.doc(id).delete()) } else saveLocal();
}
function queue(id,fn){
  queues[id]=(queues[id]||Promise.resolve()).then(fn).catch(e=>{console.warn(e);toast("Не вдалося зберегти. Перевірте інтернет.")});
}
function applySnapshot(snap){
  const docs=snap&&(snap.docs||snap)||[];
  const next={meds:{},doses:{},combos:{}};
  (Array.isArray(docs)?docs:[]).forEach(d=>{
    const data=typeof d.data==="function"?d.data():(d.data||d);
    const id=d.id||data.id; if(!data||!KIND[data.kind]) return;
    next[KIND[data.kind]][id]={...data,id};
  });
  Object.assign(S,next); render();
}
function setSync(t){const e=$("#sync");if(e)e.textContent=t}

async function initStorage(){
  backend="local"; loadLocal(); render();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(e){}
}

/* ---------- derived ---------- */
const medsList=()=>Object.values(S.meds).sort((a,b)=>(a.order||a.created)-(b.order||b.created));
const dosesOf=id=>Object.values(S.doses).filter(d=>d.medId===id).sort((a,b)=>b.at-a.at);
function interval(m){ if(+m.interval>0) return +m.interval; return m.times>0? 24/m.times : 0 }
function medStatus(m){
  const ds=dosesOf(m.id), last=ds[0], now=Date.now();
  const today=ds.filter(d=>d.at>=startOfDay()).length;
  const iv=interval(m);
  let next=null; if(last&&iv) next=last.at+iv*HOUR;
  const perDay=(+m.perDose||1)*(+m.times||0);
  const daysLeft=perDay? (+m.stock||0)/perDay : null;
  return {last,today,next,iv,daysLeft,now};
}

/* ---------- planning ---------- */
const DEF={wdWake:"07:00",wdSleep:"22:30",weWake:"09:00",weSleep:"23:00",weekend:[6,0]};
const cfgS=()=>({...DEF,...(S.settings||{})});
const hm=x=>{const q=String(x||"").split(":");return (+q[0]||0)*60+(+q[1]||0)};
const fm=t=>{t=((Math.round(t)%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
const typeOf=d=>(cfgS().weekend||[]).map(Number).includes(d.getDay())?"we":"wd";
function dayCfg(type){const st=cfgS();const w=hm(type==="we"?st.weWake:st.wdWake);let sl=hm(type==="we"?st.weSleep:st.wdSleep);if(sl<=w)sl+=1440;return {wake:w,sleep:sl,len:sl-w}}
const relW=(t,c)=>(((t-c.wake)%1440)+1440)%1440;
function outInfo(t,c){const r=relW(t,c);if(r<=c.len)return null;const after=r-c.len,before=1440-r;return after<=before?{min:after,side:"after"}:{min:before,side:"before"}}
const dkey=(t,c)=>(((t-c.wake+180)%1440)+1440)%1440;
const cdist=(a,b)=>{const d=Math.abs(a-b)%1440;return Math.min(d,1440-d)};
const hasPlan=m=>!!(m&&m.plan&&m.plan.mode&&m.plan.mode!=="none"&&(m.plan.mode==="manual"?parseTimes(m.plan.times).length:+m.times>0));
function apartHours(a,b){let h=0;(a.apart||[]).forEach(r=>{if(r.medId===b.id)h=Math.max(h,+r.hours||0)});(b.apart||[]).forEach(r=>{if(r.medId===a.id)h=Math.max(h,+r.hours||0)});return h}
function parseTimes(str){return String(str||"").split(/[\s,;]+/).filter(x=>/^\d{1,2}[:.]\d{2}$/.test(x)).map(x=>hm(x.replace(".",":")))}

const FLEXC={};
function flexTimes(m){
  const n=+m.times,iv=Math.round((interval(m)||24/n)*60),fl=Math.round((+m.plan.flex||0)*4)*15;
  const key=[n,iv,fl,JSON.stringify(cfgS())].join("|");if(FLEXC[key])return FLEXC[key];
  const cw=dayCfg("wd"),ce=dayCfg("we"),gaps=[];for(let g=iv-fl;g<=iv+fl;g+=15)gaps.push(g);
  const lo=iv-fl,hi=iv+fl;let best=null;
  const cmp=(x,y)=>{for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0};
  const rec=(t1,gs,span)=>{
    if(gs.length===n-1){const last=1440-span;if(last<lo||last>hi)return;
      const ts=[t1];gs.forEach(g=>ts.push(ts[ts.length-1]+g));
      let out=0;ts.forEach(t=>{const a=outInfo(t%1440,cw),b=outInfo(t%1440,ce);out+=(a?a.min:0)*5+(b?b.min:0)*2});
      const all=gs.concat([last]);const sc=[out,all.reduce((q,g)=>q+(g-iv)*(g-iv),0),Math.abs(ts[0]%1440-hm(cfgS().wdWake))];
      if(!best||cmp(sc,best.sc)<0)best={sc,ts:ts.map(t=>t%1440)};return}
    for(const g of gaps)rec(t1,gs.concat([g]),span+g)};
  for(let t1=0;t1<1440;t1+=15)rec(t1,[],0);
  return FLEXC[key]=best?best.ts:null;
}
function planMed(m,type,ctx,meds){
  const n=+m.times||0, c=dayCfg(type), p=m.plan||{};
  if(p.mode==="interval"&&+p.flex>0&&n>=2&&n<=4){const ft=flexTimes(m);if(ft)return ft}
  if(p.mode==="interval"){const iv=interval(m)*60||1440/n;const a=hm(p.anchor||"08:00");return Array.from({length:n},(_,k)=>Math.round(a+k*iv)%1440)}
  if(p.mode==="manual") return parseTimes(p.times);
  if(p.mode!=="awake"||!n) return [];
  const conf=[];meds.forEach(o=>{if(o.id!==m.id&&ctx[o.id]){const h=apartHours(m,o);if(h)ctx[o.id].forEach(t=>conf.push({t,h:h*60}))}});
  const pad=c.len>180?30:0, st=c.wake+pad, en=c.sleep-pad;
  const even=()=>(n===1?[st]:Array.from({length:n},(_,i)=>st+i*(en-st)/(n-1))).map(t=>Math.round(t/5)*5%1440);
  if(!conf.length||n>4) return even();
  const step=n>=3?30:15, grid=[];for(let t=st;t<=en;t+=step)grid.push(t);
  const viol=t=>conf.reduce((a,q)=>a+Math.max(0,q.h-cdist(t,q.t)),0);
  const minC=t=>conf.reduce((a,q)=>Math.min(a,cdist(t,q.t)),1e9);
  const score=set=>{let v=0,mg=1e9,mc=1e9;set.forEach((t,i)=>{v+=viol(t);mc=Math.min(mc,minC(t));if(i)mg=Math.min(mg,t-set[i-1])});if(n===1)mg=0;return [v,-mg,-mc]};
  const cmp=(x,y)=>{for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0};
  let best=null;const rec=(i0,set)=>{if(set.length===n){const sc=score(set);if(!best||cmp(sc,best.sc)<0)best={sc,set:set.slice()};return}
    for(let i=i0;i<grid.length;i++){set.push(grid[i]);rec(i+1,set);set.pop()}};
  rec(0,[]);
  return best?best.set.map(t=>t%1440):even();
}
function computePlan(type,override){
  let meds=medsList();if(override)meds=meds.filter(x=>x.id!==override.id).concat([override]);
  meds=meds.filter(hasPlan);
  const order=[...meds.filter(m=>m.plan.mode!=="awake"),...meds.filter(m=>m.plan.mode==="awake")];
  const ctx={};order.forEach(m=>ctx[m.id]=planMed(m,type,ctx,meds));
  const c=dayCfg(type),items=[];
  order.forEach(m=>ctx[m.id].forEach(t=>items.push({m,t,rel:dkey(t,c),out:outInfo(t,c)})));
  items.sort((a,b)=>a.rel-b.rel);
  items.forEach(it=>{it.conf=[];items.forEach(o=>{if(o.m.id!==it.m.id){const h=apartHours(it.m,o.m);if(h&&cdist(it.t,o.t)<h*60)it.conf.push({m:o.m,d:cdist(it.t,o.t),h})}})});
  return {items,ctx,c};
}
let PC={};
const planCache=t=>PC[t]||(PC[t]=computePlan(t));
function issueText(it){const a=[];
  if(it.out)a.push(`${fm(it.t)} — ${it.out.side==="before"?"раніше пробудження":"пізніше сну"} на ${fmtDur(it.out.min*60000)}`);
  it.conf.forEach(q=>a.push(`${fm(it.t)} — лише ${fmtDur(q.d*60000)} від «${esc(q.m.name)}» (треба ${String(q.h).replace(".",",")} год)`));
  return a.join("<br>⚠ ")}
function slotsAround(m){const res=[];for(let d=-1;d<=1;d++){const day=startOfDay()+d*86400000;const type=typeOf(new Date(day+43200000));(planCache(type).ctx[m.id]||[]).forEach(t=>res.push(day+t*60000))}return res.sort((a,b)=>a-b)}
function tolOf(m){const ts=(planCache("wd").ctx[m.id]||[]).slice().sort((a,b)=>a-b);let g=360;if(ts.length>1)ts.forEach((t,i)=>{const nx=i+1<ts.length?ts[i+1]:ts[0]+1440;g=Math.min(g,nx-t)});return Math.min(180,g/2)*60000}
function nextSlot(m){const now=Date.now(),tol=tolOf(m),ds=dosesOf(m.id);
  for(const ts of slotsAround(m)){if(ts<now-tol)continue;if(ds.some(d=>Math.abs(d.at-ts)<=tol))continue;return {ts,due:ts<=now}}return null}
function courseInfo(m){const p=m.plan||{};if(!(+p.courseDays>0&&p.start))return null;const st=new Date(p.start+"T00:00").getTime();const day=Math.floor((startOfDay()-st)/86400000+0.5)+1;
  return {day,total:+p.courseDays,done:day>+p.courseDays,notStarted:day<1}}
function previewHTML(tm){
  const md=tm.plan&&tm.plan.mode;if(!md||md==="none")return "";
  if(md!=="manual"&&!(+tm.times>0))return `<p class="hint" style="margin:0 2px 10px">Вкажіть угорі, скільки разів на день.</p>`;
  if(md==="manual"&&!parseTimes(tm.plan.times).length)return `<p class="hint" style="margin:0 2px 10px">Впишіть години через кому, напр. 08:00, 20:00.</p>`;
  const rows=["wd","we"].map(type=>{const its=computePlan(type,tm).items.filter(it=>it.m.id===tm.id);
    const iss=its.map(issueText).filter(Boolean);
    return `<div class="pv"><span class="pvl">${type==="wd"?"Будні":"Вихідні"}</span><div>${its.map(it=>`<span class="pt ${it.out||it.conf.length?"bad":""}">${fm(it.t)}</span>`).join("")}${iss.map(x=>`<div class="pvw">⚠ ${x}</div>`).join("")}</div></div>`}).join("");
  let gl="";const P0=computePlan("wd",tm),c0=P0.c,ts0=(P0.ctx[tm.id]||[]).slice().sort((a,b)=>dkey(a,c0)-dkey(b,c0));
  if(ts0.length>1)gl=`<div class="pvw" style="color:var(--muted)">Проміжки: ${ts0.map((t,i)=>fmtDur(((((i+1<ts0.length?ts0[i+1]:ts0[0])-t)%1440+1440)%1440||1440)*60000)).join(" · ")}</div>`;
  return `<div class="preview">${rows}${gl}</div>`;
}
function suggestAnchors(tm){
  const n=+tm.times;if(!n)return [];const iv=(+tm.interval>0?+tm.interval:24/n)*60;
  const cw=dayCfg("wd"),ce=dayCfg("we"),all=[],seen=new Set();
  for(let a=0;a<1440;a+=15){const ts=Array.from({length:n},(_,k)=>Math.round(a+k*iv)%1440).sort((x,y)=>dkey(x,cw)-dkey(y,cw));
    const key=ts.join();if(seen.has(key))continue;seen.add(key);
    const pen=c=>ts.reduce((q,t)=>{const o=outInfo(t,c);return q+(o?o.min:0)},0);
    const pw=pen(cw),pe=pen(ce);all.push({ts,score:pw*5+pe*2})}
  all.sort((x,y)=>x.score-y.score||dkey(x.ts[0],cw)-dkey(y.ts[0],cw));
  const pick=[];for(const o of all){if(pick.every(q=>Math.min(...q.ts.map(t=>Math.min(...o.ts.map(u=>cdist(t,u)))))>=30))pick.push(o);if(pick.length===3)break}
  pick.forEach(o=>o.desc=["wd","we"].map(type=>{const c=dayCfg(type);
    const iss=o.ts.map(t=>({t,o:outInfo(t,c)})).filter(x=>x.o).map(x=>`${fm(x.t)} — ${x.o.side==="before"?"раніше підйому":"пізніше сну"} на ${fmtDur(x.o.min*60000)}`);
    return `<b style="display:inline;font-size:13px">${type==="wd"?"Будні":"Вихідні"}:</b> ${iss.length?iss.join(", "):"усе в межах дня ✓"}`}).join("<br>"));
  return pick;
}

      else if(diff<=0) nextLine=`<span class="tag due">Час приймати · з ${fmtTime(st.next)}</span>`;

    }

      :ci.notStarted?`<div class="sub">Курс почнеться ${new Date(m.plan.start+"T12:00").toLocaleDateString("uk-UA",{day:"numeric",month:"long"})}</div>`
      :`<div>Курс: <b>день ${ci.day} з ${ci.total}</b></div>`;
    const need=ci&&!ci.done&&+m.times?Math.max(0,((ci.total-Math.max(ci.day,1)+1)*m.times-(ci.notStarted?0:st.today))*(+m.perDose||1)):null;

    }
    h+=`<div class="card med" style="--c:${m.color}">

function renderHistory(){
  const meds=medsList();
  let doses=Object.values(S.doses).sort((a,b)=>b.at-a.at);
  if(histFilter!=="all") doses=doses.filter(d=>d.medId===histFilter);
  let h=`<div class="filter"><button class="fbtn ${histFilter==="all"?"on":""}" onclick="setFilter('all')">Усі</button>
    ${meds.map(m=>`<button class="fbtn ${histFilter===m.id?"on":""}" onclick="setFilter('${m.id}')">${esc(m.name)}</button>`).join("")}</div>`;
  if(histFilter!=="all"){
    const m=S.meds[histFilter], ds=doses;
    const gaps=[]; for(let i=0;i<ds.length-1;i++) gaps.push(ds[i].at-ds[i+1].at);
    const avg=gaps.length? gaps.reduce((a,b)=>a+b,0)/gaps.length:null;
    const week=ds.filter(d=>d.at>=Date.now()-7*24*HOUR).length;
    h+=`<div class="stats"><div class="stat"><b>${week}</b><span>за 7 днів</span></div>
      <div class="stat"><b>${avg?fmtDur(avg):"—"}</b><span>сер. інтервал</span></div>
      <div class="stat"><b>${m&&m.times?interval(m).toString().replace(".",",")+" год":"—"}</b><span>за схемою</span></div></div>`;
  }
  if(!doses.length) return h+`<div class="empty"><div class="big">${flower(80)}</div>Поки що порожньо.<br>Записи з'являться після першої відмітки «Випила».</div>`;
  // previous dose of same med for intervals
  const all=Object.values(S.doses).sort((a,b)=>a.at-b.at), prev={}, lastSeen={};
  all.forEach(d=>{prev[d.id]=lastSeen[d.medId]; lastSeen[d.medId]=d});
  const groups={};
  doses.forEach(d=>{const k=startOfDay(d.at);(groups[k]=groups[k]||[]).push(d)});
  Object.keys(groups).sort((a,b)=>b-a).forEach(k=>{
    const list=groups[k];
    h+=`<div class="day"><div class="dayhead"><b>${fmtDay(+k)}</b><span class="sub">${list.length} ${plural(list.length,"прийом","прийоми","прийомів")}</span></div><div class="timeline">`;
    list.forEach(d=>{
      const m=S.meds[d.medId]; const color=m?m.color:(d.color||"#999"); const name=m?m.name:(d.medName+" (видалено)");
      const p=prev[d.id];
      const gap=p?`+${fmtDur(d.at-p.at)} після попередньої`:"перший запис";
      const combo=d.comboId&&S.combos[d.comboId]?` · ${esc(S.combos[d.comboId].name)}`:"";
      h+=`<div class="ev" style="--c:${color}"><span class="t">${fmtTime(d.at)}</span><span class="d"></span>
        <div><div style="font-weight:700">${esc(name)}${d.amount&&d.amount!=1?` <span class="sub">×${d.amount}</span>`:""}</div><div class="gap">${gap}${combo}${d.note?` · ${esc(d.note)}`:""}</div></div>
        <button class="x ${pendingDelete===d.id?"confirm":""}" onclick="askDelete('${d.id}')">${pendingDelete===d.id?"Видалити?":"×"}</button></div>`;
    });
    h+=`</div></div>`;
  });
  return h;
}

const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14)?b:c)};

/* ---------- actions ---------- */
function logDose(medId,at,extra={}){
  const m=S.meds[medId]; if(!m) return;
  const amount=+m.perDose||1;
  const d={id:uid("d"),medId,at,amount,medName:m.name,color:m.color,...extra};
  put("dose",d);
  if(m.stock!==""&&m.stock!=null) put("med",{...m,stock:Math.max(0,+(+m.stock-amount).toFixed(2))});
  return d;
}
function takeMed(id,at=Date.now(),note=""){
  const d=logDose(id,at,note?{note}:{});
  const b=document.getElementById("take_"+id); if(b){b.classList.add("done");b.textContent="✓ Записано"}
  toast(`${esc(S.meds[id].name)} — ${fmtTime(at)}`,()=>undoDoses([d.id]));
}
function takeCombo(cid,at=Date.now(),note=""){
  const c=S.combos[cid]; if(!c) return;
  const ids=c.medIds.filter(id=>S.meds[id]).map(id=>logDose(id,at,{comboId:cid,...(note?{note}:{})}).id);
  toast(`${esc(c.name)}: ${ids.length} ${plural(ids.length,"препарат","препарати","препаратів")} о ${fmtTime(at)}`,()=>undoDoses(ids));
}
function undoDoses(ids){
  ids.forEach(id=>{const d=S.doses[id]; if(!d) return; const m=S.meds[d.medId];
    if(m&&m.stock!==""&&m.stock!=null) put("med",{...m,stock:+(+m.stock+(+d.amount||1)).toFixed(2)});
    del("dose",id)});
  toast("Скасовано");
}
function askDelete(id){
  if(pendingDelete===id){pendingDelete=null; undoDoses([id]); return}
  pendingDelete=id; render(); setTimeout(()=>{if(pendingDelete===id){pendingDelete=null;render()}},3500);
}
function setFilter(f){histFilter=f;render()}

/* ---------- sheets ---------- */
function openSheet(html){
  closeSheet();
  const v=document.createElement("div"); v.className="veil"; v.id="veil";
  let title="";html=html.replace(/^\s*<h3>([\s\S]*?)<\/h3>/,(_,t)=>{title=t;return ""});
  v.innerHTML=`<div class="sheet"><div class="shead"><div class="grab"></div><div class="srow"><h3>${title}</h3><button type="button" class="sx" data-close aria-label="Закрити">✕</button></div></div>${html}</div>`;
  v.addEventListener("click",e=>{if(e.target===v)closeSheet()});
  v.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  const sh=v.querySelector(".sheet");let y0=null,dy=0;
  sh.addEventListener("touchstart",e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null;dy=0;sh.style.transition="none"},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0&&sh.scrollTop<=0){sh.style.transform=`translateY(${dy}px)`}else{dy=0;sh.style.transform=""}},{passive:true});
  sh.addEventListener("touchend",()=>{sh.style.transition="transform .2s";if(dy>110){sh.style.transform="translateY(100%)";setTimeout(closeSheet,180)}else sh.style.transform="";y0=null});
  document.body.appendChild(v); return v;
}
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function confirmDelete(zone,text,onYes){
  const old=zone.innerHTML;
  zone.innerHTML=`<div class="confirm"><p>${text}</p><div class="actions"><button type="button" class="btn ghost" style="flex:1" data-no>Ні, залишити</button><button type="button" class="btn delbtn" data-yes>Так, видалити</button></div></div>`;
  zone.querySelector("[data-no]").onclick=()=>{zone.innerHTML=old;bindDel()};
  zone.querySelector("[data-yes]").onclick=onYes;
  zone.scrollIntoView({block:"end",behavior:"smooth"});
  let bindDel=()=>{};return f=>{bindDel=f};
}
function closeSheet(){const v=$("#veil"); if(v) v.remove()}

      <option value="manual">Свій час</option></select></label>
    <div data-mode="interval">
      <label class="f"><span>Допустиме відхилення, ± год</span><input class="inp" name="flex" type="number" min="0" max="3" step="0.5" inputmode="decimal" value="${esc(p.flex||"")}" placeholder="0 — суворо рівні інтервали"></label>
      <p class="hint" style="margin:-8px 2px 14px">Напр. 1 — прийоми можуть зсуватися до ±1 год, щоб усі вклалися у ваш день. Тоді години підбираються автоматично.</p>
      <label class="f" id="anchorRow"><span>Перший прийом о</span><div class="row"><input class="inp" type="time" name="anchor" value="${esc(p.anchor||"08:00")}"><button type="button" class="btn small ghost" id="sug">Підібрати</button></div></label>
      <div id="sugbox"></div></div>
    <div data-mode="manual"><label class="f"><span>Години прийому</span><input class="inp" name="mtimes" value="${esc(p.times||"")}" placeholder="08:00, 14:00, 20:00"></label></div>
    <div data-mode="awake"><p class="hint" style="margin:-6px 2px 12px">Прийоми розподіляться між пробудженням і сном з урахуванням правил «окремо від».</p></div>
    <div id="prev"></div>

    <h4 class="sec">Окремо від інших ліків</h4>
    <div id="apart"></div>
    ${others.length?`<button type="button" class="link" id="addAp">+ Додати правило</button>`:`<p class="hint" style="margin:-4px 2px 0">Коли додасте інші ліки, тут можна буде вказати, наприклад, «щонайменше 2 год від антибіотика».</p>`}

    <h4 class="sec">Курс</h4>
    <div class="grid2">
      <label class="f"><span>Скільки днів</span><input class="inp" name="courseDays" type="number" min="1" inputmode="numeric" value="${esc(p.courseDays||"")}" placeholder="без обмеження"></label>
      <label class="f"><span>Перший день</span><input class="inp" name="start" type="date" value="${esc(p.start||"")}"></label>
    </div>

    <h4 class="sec">Вигляд</h4>
    <label class="f"><span>Колір</span><div class="swatches">${COLORS.map(c=>`<button type="button" class="sw ${c===m.color?"on":""}" style="--c:${c}" data-c="${c}"></button>`).join("")}</div></label>
    <label class="f"><span>Нотатка</span><input class="inp" name="notes" value="${esc(m.notes)}" placeholder="напр. після їжі"></label>
    <div class="actions" style="margin-top:6px"><button type="button" class="btn ghost" style="flex:1" data-close2>Скасувати</button><button class="btn">Зберегти</button></div>
    ${id?`<div id="delZone" class="delzone"><button type="button" class="link" style="color:var(--warn)" id="delMed">Видалити ці ліки</button></div>`:""}
  </form>`);
  const form=v.querySelector("#mf");form.elements.mode.value=p.mode||"none";
  let color=m.color;
  const num=(x,d)=>x===""||x==null?d:+x;
  const collect=()=>{const f=new FormData(form);
    return {...(id?m:{id:"__new",created:Date.now()}),
      name:(f.get("name")||"").trim(), dose:(f.get("dose")||"").trim(), times:Math.max(0,parseInt(f.get("times")||0)||0),
      interval:num(f.get("interval"),""), stock:num(f.get("stock"),""), perDose:+f.get("perDose")||1, color, notes:(f.get("notes")||"").trim(),
      plan:{mode:f.get("mode")||"none",flex:num(f.get("flex"),""),anchor:f.get("anchor")||"08:00",times:f.get("mtimes")||"",courseDays:num(f.get("courseDays"),""),start:f.get("start")||""},
      apart:rules.filter(r=>r.medId&&+r.hours>0).map(r=>({medId:r.medId,hours:+r.hours}))}};
  const upd=()=>{const mode=form.elements.mode.value;
    v.querySelectorAll("[data-mode]").forEach(d=>d.style.display=d.dataset.mode===mode?"":"none");
    const fx=+form.elements.flex.value>0;v.querySelector("#anchorRow").style.display=fx?"none":"";v.querySelector("#sugbox").style.display=fx?"none":"";
    const tm=collect();if(!tm.name)tm.name="Ці ліки";v.querySelector("#prev").innerHTML=previewHTML(tm)};
  const drawRules=()=>{const box=v.querySelector("#apart");
    box.innerHTML=rules.map((r,i)=>`<div class="aprow"><select class="inp" data-i="${i}" data-k="medId">${others.map(o=>`<option value="${o.id}" ${o.id===r.medId?"selected":""}>${esc(o.name)}</option>`).join("")}</select><span class="sub">мін.</span><input class="inp" style="width:72px" type="number" min="0.5" step="0.5" inputmode="decimal" data-i="${i}" data-k="hours" value="${esc(r.hours)}"><span class="sub">год</span><button type="button" class="x" data-del="${i}" aria-label="Прибрати">×</button></div>`).join("");
    box.querySelectorAll("[data-k]").forEach(el=>{el.oninput=el.onchange=()=>{rules[+el.dataset.i][el.dataset.k]=el.value;upd()}});
    box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{rules.splice(+b.dataset.del,1);drawRules();upd()})};
  const ab=v.querySelector("#addAp");if(ab)ab.onclick=()=>{rules.push({medId:others[0].id,hours:2});drawRules();upd()};
  form.addEventListener("input",upd);form.addEventListener("change",upd);
  v.querySelector("#sug").onclick=()=>{const tm=collect();const opts=suggestAnchors(tm);const box=v.querySelector("#sugbox");
    if(!opts.length){box.innerHTML=`<p class="hint">Спершу вкажіть, скільки разів на день.</p>`;return}
    box.innerHTML=`<p class="hint" style="margin:-4px 2px 8px">Найзручніші варіанти для вашого розпорядку — оберіть один:</p>`+opts.map(o=>`<button type="button" class="opt" data-a="${fm(o.ts[0])}"><b>${o.ts.map(fm).join(" · ")}</b><span>${o.desc}</span></button>`).join("");
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{form.elements.anchor.value=b.dataset.a;box.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b));upd()})};
  v.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{color=b.dataset.c;v.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b));upd()});
  v.querySelectorAll("[data-close2]").forEach(b=>b.onclick=closeSheet);
  const bindMedDel=()=>{const db=v.querySelector("#delMed");if(!db)return;
    db.onclick=()=>confirmDelete(v.querySelector("#delZone"),`Видалити «${esc(m.name)}»? Записи в історії залишаться.`,()=>{
      Object.values(S.combos).forEach(c=>{if(c.medIds.includes(id)) put("combo",{...c,medIds:c.medIds.filter(x=>x!==id)})});
      del("med",id);closeSheet();toast("Ліки видалено. Історія збережена.")})(bindMedDel)};
  bindMedDel();
  form.onsubmit=e=>{e.preventDefault();const obj=collect();if(!obj.name)return;if(!id)obj.id=uid("m");
    if(obj.plan.courseDays&&!obj.plan.start){const d=new Date();obj.plan.start=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
    put("med",obj);closeSheet();toast(id?"Збережено":"Ліки додано")};
  drawRules();upd();
}

function openSettings(){
  const st=cfgS();const days=[["Пн",1],["Вт",2],["Ср",3],["Чт",4],["Пт",5],["Сб",6],["Нд",0]];
  const v=openSheet(`<h3>Мій розпорядок</h3><p class="sub" style="margin-top:-8px">За ним додаток підбирає години прийому, коли ви не спите.</p>
  <form id="sf">
    <h4 class="sec">Будні</h4>
    <div class="grid2"><label class="f"><span>Прокидаюсь</span><input class="inp" type="time" name="wdWake" value="${st.wdWake}"></label><label class="f"><span>Лягаю спати</span><input class="inp" type="time" name="wdSleep" value="${st.wdSleep}"></label></div>
    <h4 class="sec">Вихідні</h4>
    <div class="grid2"><label class="f"><span>Прокидаюсь</span><input class="inp" type="time" name="weWake" value="${st.weWake}"></label><label class="f"><span>Лягаю спати</span><input class="inp" type="time" name="weSleep" value="${st.weSleep}"></label></div>
    <label class="f"><span>Які дні вихідні</span><div class="row" style="flex-wrap:wrap;gap:6px">${days.map(([l,d])=>`<label class="fbtn daychk"><input type="checkbox" name="we" value="${d}" ${st.weekend.map(Number).includes(d)?"checked":""}>${l}</label>`).join("")}</div></label>
    <button class="btn" style="width:100%">Зберегти</button></form>`);
  v.querySelector("#sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    S.settings={wdWake:f.get("wdWake")||DEF.wdWake,wdSleep:f.get("wdSleep")||DEF.wdSleep,weWake:f.get("weWake")||DEF.weWake,weSleep:f.get("weSleep")||DEF.weSleep,weekend:f.getAll("we").map(Number)};
    saveLocal();closeSheet();render();toast("Розпорядок збережено")};
}

let planView="today";
function renderPlan(){
  const tabs=[["today","Сьогодні"],["wd","Будні"],["we","Вихідні"]];
  let h=`<div class="filter">${tabs.map(([k,l])=>`<button class="fbtn ${planView===k?"on":""}" onclick="planView='${k}';render()">${l}</button>`).join("")}<button class="fbtn" onclick="openSettings()">⏰ Розпорядок</button></div>`;
  if(!S.settings) h+=`<div class="card" style="margin-top:14px"><div class="name" style="font-size:19px">Спершу — ваш розпорядок</div><p class="sub">Коли ви прокидаєтесь і лягаєте спати в будні та на вихідних. Тоді додаток підбере зручні години.</p><button class="btn" style="width:100%" onclick="openSettings()">Вказати розпорядок</button></div>`;
  const planned=medsList().filter(hasPlan);
  if(!planned.length) return h+`<div class="empty"><div class="big">${flower(80)}</div>Ще немає ліків із розкладом.<br>Відкрийте «Мої ліки» → «Змінити» → розділ «Розклад».</div>`;
  const isToday=planView==="today", type=isToday?typeOf(new Date()):planView, P=planCache(type), c=P.c, now=Date.now();
  h+=`<div class="dayhead"><b>${isToday?"Сьогодні":type==="we"?"Вихідний день":"Будній день"}</b><span class="sub">${type==="we"?"вихідний":"будній"} · ${fm(c.wake)}–${fm(c.sleep)}</span></div><div class="timeline" style="padding:0">`;
  let woke=false,slept=false;
  const wakeM=`<div class="mark">☀️ <b>${fm(c.wake)}</b> · прокидаюсь</div>`;
  P.items.forEach(it=>{
    if(!woke&&it.rel>=180){woke=true;h+=wakeM}
    if(!slept&&it.rel>180+c.len){slept=true;h+=`<div class="mark">🌙 <b>${fm(c.sleep)}</b> · сон</div>`}
    let status="";
    if(isToday){const ts=startOfDay()+it.t*60000,tol=tolOf(it.m);const d=dosesOf(it.m.id).find(x=>Math.abs(x.at-ts)<=tol);
      status=d?`<span class="tag ok">✓ ${fmtTime(d.at)}</span>`:now>ts+tol?`<span class="sub">не відмічено</span>`:now>=ts-20*60000?`<button class="btn small" onclick="takeMed('${it.m.id}')">Випила</button>`:""}
    const iss=issueText(it);
    h+=`<div class="ev" style="--c:${it.m.color}"><span class="t">${fm(it.t)}</span><span class="d"></span><div><div style="font-weight:700">${esc(it.m.name)}</div>${it.m.dose?`<div class="gap">${esc(it.m.dose)}</div>`:""}${iss?`<div class="gap" style="color:var(--warn)">⚠ ${iss}</div>`:""}</div><div>${status}</div></div>`;
  });
  if(!woke) h+=wakeM;
  if(!slept) h+=`<div class="mark">🌙 <b>${fm(c.sleep)}</b> · сон</div>`;
  h+=`</div><p class="hint" style="margin:12px 4px">Чи потрібні суворі інтервали саме для ваших ліків, і скільки часу між ними — уточніть у лікаря або фармацевта.</p>`;
  return h;
}

function openRefill(id){
  const m=S.meds[id];
  const v=openSheet(`<h3>Поповнити запас</h3><p class="sub" style="margin-top:-8px">${esc(m.name)} · зараз ${m.stock===""||m.stock==null?"не вказано":pieces(m.stock)}</p>
  <form id="rf"><label class="f"><span>Скільки пігулок додати</span><input class="inp" name="n" type="number" min="0" step="0.5" inputmode="decimal" required autofocus placeholder="напр. 30"></label>
  <button class="btn" style="width:100%">Додати</button></form>`);
  v.querySelector("#rf").onsubmit=e=>{e.preventDefault();const n=+new FormData(e.target).get("n")||0;
    put("med",{...m,stock:+((+m.stock||0)+n).toFixed(2)});closeSheet();toast(`Запас: ${pieces((+m.stock||0)+n)}`)};
}

function openComboForm(id){
  const c=id?S.combos[id]:{name:"",medIds:[]};
  const v=openSheet(`<h3>${id?"Змінити комбінацію":"Нова комбінація"}</h3>
  <form id="cf"><label class="f"><span>Назва</span><input class="inp" name="name" required value="${esc(c.name)}" placeholder="напр. Ранок, Вечір, Після їжі"></label>
  <label class="f"><span>Що входить</span><div class="checks">${medsList().map(m=>`<label class="check"><input type="checkbox" name="m" value="${m.id}" ${c.medIds.includes(m.id)?"checked":""}><span class="dot on" style="--c:${m.color}"></span>${esc(m.name)}</label>`).join("")}</div></label>
  <div class="actions"><button type="button" class="btn ghost" style="flex:1" data-close2>Скасувати</button><button class="btn">Зберегти</button></div>
  ${id?`<div id="delZone" class="delzone"><button type="button" class="link" style="color:var(--warn)" id="delC">Видалити комбінацію</button></div>`:""}</form>`);
  v.querySelectorAll("[data-close2]").forEach(b=>b.onclick=closeSheet);
  const bindCDel=()=>{const dc=v.querySelector("#delC");if(!dc)return;
    dc.onclick=()=>confirmDelete(v.querySelector("#delZone"),`Видалити комбінацію «${esc(c.name)}»? Самі ліки залишаться.`,()=>{del("combo",id);closeSheet();toast("Комбінацію видалено")})(bindCDel)};
  bindCDel();
  v.querySelector("#cf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const ids=f.getAll("m");
    if(!ids.length){toast("Оберіть хоча б одні ліки");return}
    put("combo",{...(id?c:{id:uid("c"),created:Date.now()}),name:f.get("name").trim(),medIds:ids});closeSheet();toast("Комбінацію збережено")};
}

function openTimeSheet(kind,id){
  const label=kind==="med"?S.meds[id].name:S.combos[id].name;
  const v=openSheet(`<h3>Коли прийняли?</h3><p class="sub" style="margin-top:-8px">${esc(label)}</p>
  <form id="tf"><label class="f"><span>Дата і час</span><input class="inp" type="datetime-local" name="at" value="${toLocalInput(Date.now())}" max="${toLocalInput(Date.now()+60000)}"></label>
  <div class="row" style="gap:8px;margin:-4px 0 14px;flex-wrap:wrap">${[15,30,60,120].map(n=>`<button type="button" class="fbtn" data-ago="${n}">${n<60?n+" хв":n/60+" год"} тому</button>`).join("")}</div>
  <label class="f"><span>Нотатка (необов'язково)</span><input class="inp" name="note" placeholder="напр. з їжею"></label>
  <button class="btn" style="width:100%">Записати</button></form>`);
  const inp=v.querySelector("[name=at]");
  v.querySelectorAll("[data-ago]").forEach(b=>b.onclick=()=>{inp.value=toLocalInput(Date.now()-b.dataset.ago*60000)});
  v.querySelector("#tf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    const at=new Date(f.get("at")).getTime()||Date.now(); const note=(f.get("note")||"").trim();
    closeSheet(); kind==="med"?takeMed(id,at,note):takeCombo(id,at,note)};
}

/* ---------- backup ---------- */
const BK="mylikiv1_lastbackup";
function markBackup(){try{localStorage.setItem(BK,Date.now())}catch(e){} toast("Копію збережено"); render()}
async function saveBackup(){
  const txt=JSON.stringify({app:"moi-liky",v:1,savedAt:Date.now(),data:S});
  const name=`moi-liky-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([txt],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Мої ліки — копія"}); return markBackup() } }
  catch(e){ if(e&&e.name==="AbortError") return }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); markBackup();
}
function restoreFrom(text){
  let j; try{j=JSON.parse(text)}catch(e){return toast("Не вдалося прочитати копію")}
  const d=(j&&j.data)||j;
  if(!d||typeof d.meds!=="object") return toast("Це не схоже на копію «Мої ліки»");
  S.meds=d.meds||{}; S.doses=d.doses||{}; S.combos=d.combos||{}; if(d.settings) S.settings=d.settings;
  saveLocal(); closeSheet(); render(); toast("Дані відновлено");
}
function openRestore(){
  const v=openSheet(`<h3>Відновити з копії</h3>
  <p class="sub" style="margin-top:-8px">Поточні дані на цьому телефоні буде замінено даними з копії.</p>
  <label class="f"><span>Файл копії (.json)</span><input class="inp" type="file" accept=".json,application/json,text/plain" id="rfile"></label>
  <label class="f"><span>…або вставте скопійований текст</span><textarea class="inp" id="rtext" rows="4" placeholder="{&quot;app&quot;:&quot;moi-liky&quot; …}"></textarea></label>
  <button class="btn" style="width:100%" id="rgo">Відновити</button>`);
  v.querySelector("#rgo").onclick=async()=>{
    const f=v.querySelector("#rfile").files[0];
    if(f) return restoreFrom(await f.text());
    const t=v.querySelector("#rtext").value.trim();
    if(t) return restoreFrom(t);
    toast("Оберіть файл або вставте текст");
  };
}

/* ---------- toast ---------- */
let tt;
function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(t=>t.remove()); clearTimeout(tt);
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=`<span>${msg}</span>`;
  if(undo){const b=document.createElement("button");b.textContent="Скасувати";b.onclick=()=>{t.remove();undo()};t.appendChild(b)}
  document.body.appendChild(t); tt=setTimeout(()=>t.remove(),undo?5000:2200);
}

/* ---------- boot ---------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;pendingDelete=null;closeSheet();render();scrollTo(0,0)});
setInterval(()=>{ if(!$("#veil")) render() },30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#veil"))render()});
$("#flw").innerHTML=flower(44); render(); initStorage();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
