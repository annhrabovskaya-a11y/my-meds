*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Alegreya Sans",system-ui,-apple-system,sans-serif;font-size:17px}
html{background:var(--bg)}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh;
  background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,#8a6a400a 3px 4px),repeating-linear-gradient(90deg,transparent 0 3px,#8a6a400a 3px 4px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.band{height:34px;background:var(--band) repeat-x center/auto 34px;margin:0 0 4px}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 2px 14px}
.ttl{display:flex;align-items:center;gap:10px}
h1{font-family:Alegreya,Georgia,serif;font-size:32px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1}
.date{color:var(--muted);font-size:15px;margin-top:4px;font-style:italic}
.sync{flex:none;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
h2{font-family:Alegreya,Georgia,serif;font-size:19px;font-weight:700;color:var(--accent);margin:28px 4px 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:9px;height:9px;background:var(--accent);transform:rotate(45deg);flex:none;box-shadow:13px -0px 0 -2px var(--ink)}
h2::after{content:"";flex:1;height:5px;background:var(--stitch);opacity:.35;border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 8px 22px -16px #5a3a1a55;position:relative;overflow:hidden}
.card.med{padding-top:20px}
.card.med::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:4px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 12px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.name{font-family:Alegreya,Georgia,serif;font-weight:800;font-size:21px;line-height:1.15}
.sub{color:var(--muted);font-size:15px}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:14px;height:14px;position:relative;display:inline-block;flex:none}
.dot::before,.dot::after{content:"";position:absolute;left:50%;top:50%;width:17px;height:4px;border-radius:2px;background:var(--c);opacity:.22;transform:translate(-50%,-50%) rotate(45deg)}
.dot::after{transform:translate(-50%,-50%) rotate(-45deg)}
.dot.on::before,.dot.on::after{opacity:1}
.count{font-size:14px;color:var(--muted);font-weight:700}
.lines{margin:12px 0 14px;display:grid;gap:6px;font-size:16px}
.lines b{font-weight:800}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px}
.tag.due{background:var(--due-soft);color:#7c4f08}
.tag.ok{background:#E3ECDD;color:var(--green)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;gap:8px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:800;padding:13px 18px;border-radius:12px;flex:1;font-size:17px;transition:transform .08s;box-shadow:inset 0 -3px 0 #0000002e}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#EDE1CE;color:var(--ink);flex:0 0 auto;box-shadow:inset 0 -2px 0 #0000001a}
.btn.small{padding:9px 14px;font-size:15px;border-radius:11px;flex:0 0 auto}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.done{background:var(--green)}
.link{color:var(--accent);font-weight:800;font-size:15px;padding:6px 2px}
.empty{text-align:center;padding:30px 20px;color:var(--muted);font-size:17px}
.empty .big{margin-bottom:10px}
.combo{display:flex;align-items:center;gap:12px}
.combo .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,#FFFCF6);color:color-mix(in srgb,var(--c) 75%,black)}
.day{margin-bottom:8px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px}
.dayhead b{font-family:Alegreya,Georgia,serif;font-size:18px}
.timeline{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 0;box-shadow:0 8px 22px -16px #5a3a1a55}
.ev{display:grid;grid-template-columns:56px 14px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev .t{font-weight:800;font-variant-numeric:tabular-nums}
.ev .d{width:10px;height:10px;background:var(--c);transform:rotate(45deg);border-radius:1px}
.ev .gap{font-size:14px;color:var(--muted)}
.ev .x{color:var(--muted);font-size:20px;padding:4px 8px;border-radius:10px}
.ev .x.confirm{background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:800}
.filter{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.fbtn{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px}
.fbtn.on{background:var(--ink);color:#FFF8EE;border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:Alegreya,Georgia,serif;font-size:21px}
.stat span{font-size:13px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:#FFFCF6f2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;padding:12px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--stitch)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:13px;font-weight:700;color:var(--muted);border-radius:12px}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--accent);background:var(--accent-soft)}
.veil{position:fixed;inset:0;background:#2b232070;z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.grab{height:26px;background:var(--band) repeat-x center/auto 26px;margin:0}
.shead{position:sticky;top:0;z-index:3;background:var(--bg);margin:0 -18px 6px;padding-bottom:2px}
.shead .grab{margin:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 8px}
.srow h3{margin:0!important;padding:0!important}
.sx{flex:none;width:38px;height:38px;border-radius:50%;background:#EDE1CE;font-size:17px;font-weight:800;color:var(--ink);box-shadow:inset 0 -2px 0 #0000001a}
.delzone{text-align:center;margin-top:16px}
.confirm{background:var(--warn-soft);border-radius:14px;padding:12px;text-align:left}
.confirm p{margin:0 0 10px;font-weight:700;color:var(--warn)}
.btn.delbtn{background:var(--warn);flex:1}
.grid2>*{min-width:0}
.inp{min-width:0;max-width:100%}
input[type=date].inp,input[type=time].inp{-webkit-appearance:none;appearance:none;display:block;min-height:50px;line-height:1.3}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.sheet{position:relative}
.sheet h3{font-family:Alegreya,Georgia,serif;margin:4px 0 16px;font-size:24px;font-weight:800}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:5px 2px 0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--card);box-shadow:0 0 0 2px var(--c)}
.checks{display:grid;gap:8px}
.check{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:12px;border-radius:12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#FFF8EE;padding:11px 16px;border-radius:12px;font-weight:700;font-size:15px;z-index:20;display:flex;gap:14px;align-items:center;animation:up .2s;max-width:92vw}
.toast button{color:#E9B35A;font-weight:800}
.notice{font-size:14px;color:var(--muted);background:var(--card);border:1px dashed #d6c4a8;border-radius:14px;padding:12px;margin-top:22px;line-height:1.45}
.foot{display:flex;justify-content:center;margin-top:30px;opacity:.9}
.greet{font-family:Alegreya,Georgia,serif;font-size:20px;font-weight:700;color:var(--accent);margin:-4px 4px 14px}
.sec{font-family:Alegreya,Georgia,serif;font-size:18px;color:var(--accent);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.preview{background:var(--card);border:1px dashed #d6c4a8;border-radius:12px;padding:10px 12px;margin:0 0 6px;display:grid;gap:8px}
.pv{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start}
.pvl{font-weight:800;font-size:14px;color:var(--muted);padding-top:3px}
.pt{display:inline-block;font-weight:800;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px;margin:0 5px 5px 0}
.pt.bad{background:var(--due-soft);color:#7c4f08}
.pvw{font-size:13px;color:#7c4f08;margin-top:2px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.opt b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.opt span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.aprow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.aprow select{flex:1;min-width:0}
.aprow .x{color:var(--muted);font-size:22px;padding:4px 8px}
.mark{padding:9px 14px;font-size:14px;color:var(--muted);background:#F7EFE2;border-bottom:1px dashed var(--line)}
.mark:first-child{border-radius:var(--r) var(--r) 0 0}
.mark:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:0}
.daychk{display:inline-flex;align-items:center;cursor:pointer}
.daychk input{display:none}
.daychk:has(input:checked){background:var(--ink);color:#FFF8EE;border-color:var(--ink)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* ---------- modern theme ---------- */
html[data-theme=modern]{--bg:#F5F6F8;--card:#FFFFFF;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--accent:#0F766E;--accent-ink:#fff;--accent-soft:#E6F3F1;--gold:#CA8A04;--green:#16A34A;--warn:#DC2626;--warn-soft:#FEE2E2;--due:#B45309;--due-soft:#FEF3C7;--r:18px}
[data-theme=modern] body{font-family:Inter,system-ui,-apple-system,sans-serif;background-image:none;font-size:16px}
[data-theme=modern] .band,[data-theme=modern] .foot{display:none}
[data-theme=modern] .wrap{padding-top:22px}
[data-theme=modern] h1,[data-theme=modern] .name,[data-theme=modern] .sheet h3,[data-theme=modern] .stat b,[data-theme=modern] .dayhead b,[data-theme=modern] .greet,[data-theme=modern] .sec,[data-theme=modern] h2{font-family:Inter,system-ui,-apple-system,sans-serif}
[data-theme=modern] h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
[data-theme=modern] .date{font-style:normal}
[data-theme=modern] .name{font-size:18px;font-weight:700;letter-spacing:-.01em}
[data-theme=modern] .sheet h3{font-size:22px;letter-spacing:-.02em}
[data-theme=modern] h2,[data-theme=modern] .sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
[data-theme=modern] h2::before,[data-theme=modern] h2::after,[data-theme=modern] .sec::before{display:none}
[data-theme=modern] .card{border:0;box-shadow:0 1px 2px #0000000d,0 6px 18px -10px #00000026}
[data-theme=modern] .card.med{padding:16px 16px 16px 20px}
[data-theme=modern] .card.med::before{left:0;right:auto;top:0;bottom:0;height:auto;width:5px;border-radius:0;background:var(--c)}
[data-theme=modern] .dot{border-radius:50%;border:2px solid var(--c);width:12px;height:12px}
[data-theme=modern] .dot::before,[data-theme=modern] .dot::after{display:none}
[data-theme=modern] .dot.on{background:var(--c)}
[data-theme=modern] .ev .d{transform:none;border-radius:50%}
[data-theme=modern] .ev{border-bottom-style:solid}
[data-theme=modern] .btn{box-shadow:none;border-radius:12px;font-weight:700;font-size:16px}
[data-theme=modern] .btn.ghost{background:#EEF0F3}
[data-theme=modern] nav{background:#ffffffeb;border-top:1px solid var(--line)}
[data-theme=modern] nav::before{display:none}
[data-theme=modern] .grab{height:5px;width:40px;border-radius:9px;background:#D1D5DB;margin:8px auto 0}
[data-theme=modern] .mark{background:#F3F4F6}
[data-theme=modern] .timeline,[data-theme=modern] .stat,[data-theme=modern] .opt,[data-theme=modern] .check,[data-theme=modern] .inp,[data-theme=modern] .fbtn{border-color:var(--line)}
[data-theme=modern] .timeline,[data-theme=modern] .stat{border:0;box-shadow:0 1px 2px #0000000d}
[data-theme=modern] .greet{color:var(--ink);font-size:18px}
[data-theme=modern] .notice,[data-theme=modern] .preview{border-style:solid;border-color:var(--line)}
[data-theme=modern] .tag.ok{background:#DCFCE7;color:#15803D}
[data-theme=modern] .pt.bad{color:#92400E}
[data-theme=modern] .pvw{color:#92400E}
[data-theme=modern] .toast button{color:#5EEAD4}
[data-theme=modern] .chip{background:color-mix(in srgb,var(--c) 12%,white)}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <header>
    <div class="ttl"><span id="flw"></span><div><h1 id="title">Сьогодні</h1><div class="date" id="today"></div></div></div>
    
  </header>
  <main id="main"></main>
</div>
<nav><div class="in">
  <button data-tab="today" class="on"><span class="i">💊</span><span class="lbl">Сьогодні</span></button>
  <button data-tab="plan"><span class="i">🗓️</span><span class="lbl">План</span></button>
  <button data-tab="history"><span class="i">🕘</span><span class="lbl">Історія</span></button>
  <button data-tab="meds"><span class="i">⚙️</span><span class="lbl">Мої ліки</span></button>
</div></nav>

<script>
/* ---------- language & theme ---------- */
const APP_VERSION="7 · 6.11.2026";
const DEFAULT_LANG=/^(uk|ru|be)/i.test(navigator.language||"")?"uk":"en";
const lang=()=>(S.profile&&S.profile.lang)||DEFAULT_LANG;
const theme=()=>(S.profile&&S.profile.theme)||"folk";
const L=(u,e)=>lang()==="en"?e:u;
const LOC=()=>lang()==="en"?"en-GB":"uk-UA";
function applyLook(){
  document.documentElement.dataset.theme=theme();
  document.documentElement.lang=lang();
  document.title=L("Мої ліки","My Meds");
  const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=theme()==="modern"?"#F5F6F8":"#F3EBDD";
}

/* ---------- helpers ---------- */
const COLORS_FOLK=["#A8231C","#2B2320","#3F6B3A","#C8902E","#2F4F7F","#7A1F2B","#B5562E","#6F7A2E"];
const COLORS_MODERN=["#0F766E","#2563EB","#7C3AED","#DB2777","#EA580C","#CA8A04","#16A34A","#475569"];
const COLORS=()=>theme()==="modern"?COLORS_MODERN:COLORS_FOLK;
function flower(sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" aria-hidden="true">
<path d="M32 62C32 50 31 42 32 34" stroke="#3F6B3A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<path d="M31 50C22 49 14 42 12 34C21 35 28 41 31 50Z" fill="#3F6B3A"/><path d="M33 46C41 46 49 40 52 32C43 32 36 38 33 46Z" fill="#5A8A4E"/>
<path d="M17 41C20 40 24 41 26 43" stroke="#FFFCF6" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<g transform="translate(32 22)">${[0,72,144,216,288].map(a=>`<path transform="rotate(${a})" d="M0 -3C-7 -8 -7 -18 0 -21C7 -18 7 -8 0 -3Z" fill="#A8231C"/><path transform="rotate(${a})" d="M0 -6C-2.5 -9 -2.5 -14 0 -16C2.5 -14 2.5 -9 0 -6Z" fill="#E0663F"/>`).join("")}
<circle r="6" fill="#C8902E"/><circle r="2.6" fill="#2B2320"/></g>
<circle cx="10" cy="22" r="2.6" fill="#A8231C"/><circle cx="7" cy="27" r="2" fill="#2B2320"/><circle cx="54" cy="22" r="2.6" fill="#A8231C"/><circle cx="57" cy="27" r="2" fill="#2B2320"/></svg>`}
function pillIcon(sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" aria-hidden="true">
<rect x="4" y="4" width="56" height="56" rx="16" fill="var(--accent)"/>
<g transform="rotate(-40 32 32)"><rect x="14" y="23" width="36" height="18" rx="9" fill="#fff"/><rect x="32" y="23" width="18" height="18" rx="0" fill="#ffffffaa"/><rect x="41" y="23" width="9" height="18" rx="9" fill="#ffffffaa"/><path d="M32 23V41" stroke="var(--accent)" stroke-width="2"/></g></svg>`}
const logo=sz=>theme()==="modern"?pillIcon(sz):flower(sz);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const HOUR=3600e3;
const dec=n=>lang()==="en"?String(n):String(n).replace(".",",");
const fmtTime=ts=>new Date(ts).toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"});
const fmtDay=ts=>{
  const d=new Date(ts), t=new Date(); const y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return L("Сьогодні","Today");
  if(d.toDateString()===y.toDateString()) return L("Вчора","Yesterday");
  return d.toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"});
};
function fmtDur(ms){
  ms=Math.abs(ms); const m=Math.round(ms/60000);
  if(m<1) return L("щойно","just now");
  const h=Math.floor(m/60), mm=m%60;
  if(h>=48) return Math.floor(h/24)+L(" дн "," d ")+(h%24)+L(" год"," h");
  return [h?h+L(" год"," h"):"",(mm||!h)?mm+L(" хв"," min"):""].filter(Boolean).join(" ");
}
const startOfDay=(ts=Date.now())=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const toLocalInput=ts=>{const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
function pieces(n){n=+n;const v=Number.isInteger(n)?n:dec(n.toFixed(1));return v+L(" шт"," pcs")}
const plural=(n,a,b,c)=>{if(lang()==="en")return n===1?a:b;const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<12||m100>14)?b:c)};
const pl=(n,ua,en)=>plural(n,...(lang()==="en"?en:ua));

/* ---------- state & storage ---------- */
const S={meds:{},doses:{},combos:{}};
const KIND={med:"meds",dose:"doses",combo:"combos"};
let backend=null;
const LS="mylikiv1";
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){Object.assign(S,j)}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function put(kind,obj){S[KIND[kind]][obj.id]=obj;render();saveLocal()}
function del(kind,id){delete S[KIND[kind]][id];render();saveLocal()}
async function initStorage(){
  backend="local"; loadLocal(); applyLook(); render();
  if(!S.profile) setTimeout(()=>{if(!$("#veil"))openProfile(true)},400);
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(e){}
}

/* ---------- derived ---------- */
const medsList=()=>Object.values(S.meds).sort((a,b)=>(a.order||a.created)-(b.order||b.created));
const dosesOf=id=>Object.values(S.doses).filter(d=>d.medId===id).sort((a,b)=>b.at-a.at);
function interval(m){ if(+m.interval>0) return +m.interval; return m.times>0? 24/m.times : 0 }
function medStatus(m){
  const ds=dosesOf(m.id), last=ds[0], now=Date.now();
  const today=ds.filter(d=>d.at>=startOfDay()).length;
  const iv=interval(m);
  let next=null; if(last&&iv) next=last.at+iv*HOUR;
  const perDay=(+m.perDose||1)*(+m.times||0);
  const daysLeft=perDay? (+m.stock||0)/perDay : null;
  return {last,today,next,iv,daysLeft,now};
}

/* ---------- profile & settings ---------- */
const prof=()=>S.profile||{};
const gx=(f,m,n)=>{const g=prof().gender;return g==="m"?m:g==="n"?n:f};
const TOOK=()=>L(gx("Випила","Випив","Прийнято"),"Taken");
const TOOK_ALL=()=>L(gx("Випила все","Випив все","Прийнято все"),"All taken");
function greet(){const n=(prof().name||"").trim();if(!n)return "";const h=new Date().getHours();
  const w=h<5?L("Доброї ночі","Good night"):h<12?L("Доброго ранку","Good morning"):h<18?L("Доброго дня","Good afternoon"):L("Доброго вечора","Good evening");return `${w}, ${esc(n)}!`}
function openProfile(first,draft){
  const p={...prof(),...(draft||{})};
  const radios=(name,opts,val)=>opts.map(([k,l])=>`<label class="fbtn daychk"><input type="radio" name="${name}" value="${k}" ${(val||"")===k?"checked":""}>${l}</label>`).join("");
  const v=openSheet(`<h3>${first?L("Вітаю! 🌸","Welcome! 👋"):L("Налаштування","Settings")}</h3>
  ${first?`<p class="sub" style="margin-top:-4px">${L("Кілька налаштувань — і можна починати.","A couple of settings and you're ready.")}</p>`:""}
  <form id="pf">
    <label class="f"><span>${L("Мова","Language")}</span><div class="row" style="flex-wrap:wrap;gap:6px">${radios("lang",[["uk","Українська"],["en","English"]],lang())}</div></label>
    <label class="f"><span>${L("Тема","Theme")}</span><div class="row" style="flex-wrap:wrap;gap:6px">${radios("theme",[["folk",L("Українська 🌸","Ukrainian folk 🌸")],["modern",L("Сучасна","Modern")]],theme())}</div></label>
    <label class="f"><span>${L("Як вас звати","Your name")}</span><input class="inp" name="name" value="${esc(p.name||"")}" placeholder="${L("напр. Анна","e.g. Anna")}" autocomplete="given-name"></label>
    ${lang()==="uk"?`<label class="f"><span>Стать</span><div class="row" style="flex-wrap:wrap;gap:6px">${radios("gender",[["f","Жіноча"],["m","Чоловіча"],["n","Не вказувати"]],p.gender)}</div></label>
    <p class="hint" style="margin:-6px 2px 16px">Від цього залежать написи: «Випила», «Випив» або нейтральне «Прийнято».</p>`:`<input type="hidden" name="gender" value="${esc(p.gender||"n")}">`}
    <div class="actions">${first?`<button type="button" class="btn ghost" style="flex:1" id="pskip">${L("Пропустити","Skip")}</button>`:`<button type="button" class="btn ghost" style="flex:1" data-close2>${L("Скасувати","Cancel")}</button>`}<button class="btn">${L("Зберегти","Save")}</button></div>
  </form>`);
  const form=v.querySelector("#pf");
  const keep=()=>{const f=new FormData(form);return {name:f.get("name")||"",gender:f.get("gender")||p.gender}};

/* ---------- planning ---------- */
const DEF={wdWake:"07:00",wdSleep:"22:30",weWake:"09:00",weSleep:"23:00",weekend:[6,0]};
const cfgS=()=>({...DEF,...(S.settings||{})});
const hm=x=>{const q=String(x||"").split(":");return (+q[0]||0)*60+(+q[1]||0)};
const fm=t=>{t=((Math.round(t)%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
const typeOf=d=>(cfgS().weekend||[]).map(Number).includes(d.getDay())?"we":"wd";
function dayCfg(type){const st=cfgS();const w=hm(type==="we"?st.weWake:st.wdWake);let sl=hm(type==="we"?st.weSleep:st.wdSleep);if(sl<=w)sl+=1440;return {wake:w,sleep:sl,len:sl-w}}
const relW=(t,c)=>(((t-c.wake)%1440)+1440)%1440;
function outInfo(t,c){const r=relW(t,c);if(r<=c.len)return null;const after=r-c.len,before=1440-r;return after<=before?{min:after,side:"after"}:{min:before,side:"before"}}
const dkey=(t,c)=>(((t-c.wake+180)%1440)+1440)%1440;
const cdist=(a,b)=>{const d=Math.abs(a-b)%1440;return Math.min(d,1440-d)};
const hasPlan=m=>!!(m&&m.plan&&m.plan.mode&&m.plan.mode!=="none"&&(m.plan.mode==="manual"?parseTimes(m.plan.times).length:+m.times>0));
function apartHours(a,b){let h=0;(a.apart||[]).forEach(r=>{if(r.medId===b.id)h=Math.max(h,+r.hours||0)});(b.apart||[]).forEach(r=>{if(r.medId===a.id)h=Math.max(h,+r.hours||0)});return h}
function parseTimes(str){return String(str||"").split(/[\s,;]+/).filter(x=>/^\d{1,2}[:.]\d{2}$/.test(x)).map(x=>hm(x.replace(".",":")))}
const WD=()=>L("Будні","Weekdays"), WE=()=>L("Вихідні","Weekends");
const sideTxt=(side,short)=>side==="before"?(short?L("раніше підйому","before waking"):L("раніше пробудження","before waking")):L("пізніше сну","after bedtime");

const FLEXC={};
function flexTimes(m){
  const n=+m.times,iv=Math.round((interval(m)||24/n)*60),fl=Math.round((+m.plan.flex||0)*4)*15;
  const key=[n,iv,fl,JSON.stringify(cfgS())].join("|");if(FLEXC[key])return FLEXC[key];
  const cw=dayCfg("wd"),ce=dayCfg("we"),gaps=[];for(let g=iv-fl;g<=iv+fl;g+=15)gaps.push(g);
  const lo=iv-fl,hi=iv+fl;let best=null;
  const cmp=(x,y)=>{for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0};
  const rec=(t1,gs,span)=>{
    if(gs.length===n-1){const last=1440-span;if(last<lo||last>hi)return;
      const ts=[t1];gs.forEach(g=>ts.push(ts[ts.length-1]+g));
      let out=0;ts.forEach(t=>{const a=outInfo(t%1440,cw),b=outInfo(t%1440,ce);out+=(a?a.min:0)*5+(b?b.min:0)*2});
      const all=gs.concat([last]);const sc=[out,all.reduce((q,g)=>q+(g-iv)*(g-iv),0),Math.abs(ts[0]%1440-hm(cfgS().wdWake))];
      if(!best||cmp(sc,best.sc)<0)best={sc,ts:ts.map(t=>t%1440)};return}
    for(const g of gaps)rec(t1,gs.concat([g]),span+g)};
  for(let t1=0;t1<1440;t1+=15)rec(t1,[],0);
  return FLEXC[key]=best?best.ts:null;
}
function planMed(m,type,ctx,meds){
  const n=+m.times||0, c=dayCfg(type), p=m.plan||{};
  if(p.mode==="interval"&&+p.flex>0&&n>=2&&n<=4){const ft=flexTimes(m);if(ft)return ft}
  if(p.mode==="interval"){const iv=interval(m)*60||1440/n;const a=hm(p.anchor||"08:00");return Array.from({length:n},(_,k)=>Math.round(a+k*iv)%1440)}
  if(p.mode==="manual") return parseTimes(p.times);
  if(p.mode!=="awake"||!n) return [];
  const conf=[];meds.forEach(o=>{if(o.id!==m.id&&ctx[o.id]){const h=apartHours(m,o);if(h)ctx[o.id].forEach(t=>conf.push({t,h:h*60}))}});
  const pad=c.len>180?30:0, st=c.wake+pad, en=c.sleep-pad;
  const even=()=>(n===1?[st]:Array.from({length:n},(_,i)=>st+i*(en-st)/(n-1))).map(t=>Math.round(t/5)*5%1440);
  if(!conf.length||n>4) return even();
  const step=n>=3?30:15, grid=[];for(let t=st;t<=en;t+=step)grid.push(t);
  const viol=t=>conf.reduce((a,q)=>a+Math.max(0,q.h-cdist(t,q.t)),0);
  const minC=t=>conf.reduce((a,q)=>Math.min(a,cdist(t,q.t)),1e9);
  const score=set=>{let v=0,mg=1e9,mc=1e9;set.forEach((t,i)=>{v+=viol(t);mc=Math.min(mc,minC(t));if(i)mg=Math.min(mg,t-set[i-1])});if(n===1)mg=0;return [v,-mg,-mc]};
  const cmp=(x,y)=>{for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0};
  let best=null;const rec=(i0,set)=>{if(set.length===n){const sc=score(set);if(!best||cmp(sc,best.sc)<0)best={sc,set:set.slice()};return}
    for(let i=i0;i<grid.length;i++){set.push(grid[i]);rec(i+1,set);set.pop()}};
  rec(0,[]);
  return best?best.set.map(t=>t%1440):even();
}
function computePlan(type,override){
  let meds=medsList();if(override)meds=meds.filter(x=>x.id!==override.id).concat([override]);
  meds=meds.filter(hasPlan);
  const order=[...meds.filter(m=>m.plan.mode!=="awake"),...meds.filter(m=>m.plan.mode==="awake")];
  const ctx={};order.forEach(m=>ctx[m.id]=planMed(m,type,ctx,meds));
  const c=dayCfg(type),items=[];
  order.forEach(m=>ctx[m.id].forEach(t=>items.push({m,t,rel:dkey(t,c),out:outInfo(t,c)})));
  items.sort((a,b)=>a.rel-b.rel);
  items.forEach(it=>{it.conf=[];items.forEach(o=>{if(o.m.id!==it.m.id){const h=apartHours(it.m,o.m);if(h&&cdist(it.t,o.t)<h*60)it.conf.push({m:o.m,d:cdist(it.t,o.t),h})}})});
  return {items,ctx,c};
}
let PC={};
const planCache=t=>PC[t]||(PC[t]=computePlan(t));
function issueText(it){const a=[];
  if(it.out)a.push(`${fm(it.t)} — ${L("на "+fmtDur(it.out.min*60000)+" "+sideTxt(it.out.side),fmtDur(it.out.min*60000)+" "+sideTxt(it.out.side))}`);
  it.conf.forEach(q=>a.push(`${fm(it.t)} — ${L(`лише ${fmtDur(q.d*60000)} від «${esc(q.m.name)}» (треба ${dec(q.h)} год)`,`only ${fmtDur(q.d*60000)} from “${esc(q.m.name)}” (needs ${q.h} h)`)}`));
  return a.join("<br>⚠ ")}
function slotsAround(m){const res=[];for(let d=-1;d<=1;d++){const day=startOfDay()+d*86400000;const type=typeOf(new Date(day+43200000));(planCache(type).ctx[m.id]||[]).forEach(t=>res.push(day+t*60000))}return res.sort((a,b)=>a-b)}
function tolOf(m){const ts=(planCache("wd").ctx[m.id]||[]).slice().sort((a,b)=>a-b);let g=360;if(ts.length>1)ts.forEach((t,i)=>{const nx=i+1<ts.length?ts[i+1]:ts[0]+1440;g=Math.min(g,nx-t)});return Math.min(180,g/2)*60000}
function nextSlot(m){const now=Date.now(),tol=tolOf(m),ds=dosesOf(m.id);
  for(const ts of slotsAround(m)){if(ts<now-tol)continue;if(ds.some(d=>Math.abs(d.at-ts)<=tol))continue;return {ts,due:ts<=now}}return null}
function courseInfo(m){const p=m.plan||{};if(!(+p.courseDays>0&&p.start))return null;const st=new Date(p.start+"T00:00").getTime();const day=Math.floor((startOfDay()-st)/86400000+0.5)+1;
  return {day,total:+p.courseDays,done:day>+p.courseDays,notStarted:day<1}}
function previewHTML(tm){
  const md=tm.plan&&tm.plan.mode;if(!md||md==="none")return "";
  if(md!=="manual"&&!(+tm.times>0))return `<p class="hint" style="margin:0 2px 10px">${L("Вкажіть угорі, скільки разів на день.","Set “times per day” above.")}</p>`;
  if(md==="manual"&&!parseTimes(tm.plan.times).length)return `<p class="hint" style="margin:0 2px 10px">${L("Впишіть години через кому, напр. 08:00, 20:00.","Type times separated by commas, e.g. 08:00, 20:00.")}</p>`;
  const rows=["wd","we"].map(type=>{const its=computePlan(type,tm).items.filter(it=>it.m.id===tm.id);
    const iss=its.map(issueText).filter(Boolean);
    return `<div class="pv"><span class="pvl">${type==="wd"?WD():WE()}</span><div>${its.map(it=>`<span class="pt ${it.out||it.conf.length?"bad":""}">${fm(it.t)}</span>`).join("")}${iss.map(x=>`<div class="pvw">⚠ ${x}</div>`).join("")}</div></div>`}).join("");
  let gl="";const P0=computePlan("wd",tm),c0=P0.c,ts0=(P0.ctx[tm.id]||[]).slice().sort((a,b)=>dkey(a,c0)-dkey(b,c0));
  if(ts0.length>1)gl=`<div class="pvw" style="color:var(--muted)">${L("Проміжки","Gaps")}: ${ts0.map((t,i)=>fmtDur(((((i+1<ts0.length?ts0[i+1]:ts0[0])-t)%1440+1440)%1440||1440)*60000)).join(" · ")}</div>`;
  return `<div class="preview">${rows}${gl}</div>`;
}
function suggestAnchors(tm){
  const n=+tm.times;if(!n)return [];const iv=(+tm.interval>0?+tm.interval:24/n)*60;
  const cw=dayCfg("wd"),ce=dayCfg("we"),all=[],seen=new Set();
  for(let a=0;a<1440;a+=15){const ts=Array.from({length:n},(_,k)=>Math.round(a+k*iv)%1440).sort((x,y)=>dkey(x,cw)-dkey(y,cw));
    const key=ts.join();if(seen.has(key))continue;seen.add(key);
    const pen=c=>ts.reduce((q,t)=>{const o=outInfo(t,c);return q+(o?o.min:0)},0);
    const pw=pen(cw),pe=pen(ce);all.push({ts,score:pw*5+pe*2})}
  all.sort((x,y)=>x.score-y.score||dkey(x.ts[0],cw)-dkey(y.ts[0],cw));
  const pick=[];for(const o of all){if(pick.every(q=>Math.min(...q.ts.map(t=>Math.min(...o.ts.map(u=>cdist(t,u)))))>=30))pick.push(o);if(pick.length===3)break}
  pick.forEach(o=>o.desc=["wd","we"].map(type=>{const c=dayCfg(type);
    const iss=o.ts.map(t=>({t,o:outInfo(t,c)})).filter(x=>x.o).map(x=>`${fm(x.t)} — ${L("на "+fmtDur(x.o.min*60000)+" "+sideTxt(x.o.side,1),fmtDur(x.o.min*60000)+" "+sideTxt(x.o.side,1))}`);
    return `<b style="display:inline;font-size:13px">${type==="wd"?WD():WE()}:</b> ${iss.length?iss.join(", "):L("усе в межах дня ✓","all within your day ✓")}`}).join("<br>"));
  return pick;
}

        <div><div style="font-weight:700">${esc(name)}${d.amount&&d.amount!=1?` <span class="sub">×${d.amount}</span>`:""}</div><div class="gap">${gap}${combo}${d.note?` · ${esc(d.note)}`:""}</div></div>

    });
    h+=`</div></div>`;
  });
  return h;
}

/* ---------- actions ---------- */
function logDose(medId,at,extra={}){
  const m=S.meds[medId]; if(!m) return;
  const amount=+m.perDose||1;
  const d={id:uid("d"),medId,at,amount,medName:m.name,color:m.color,...extra};
  put("dose",d);
  if(m.stock!==""&&m.stock!=null) put("med",{...m,stock:Math.max(0,+(+m.stock-amount).toFixed(2))});
  return d;
}
function takeMed(id,at=Date.now(),note=""){
  const d=logDose(id,at,note?{note}:{});
  const b=document.getElementById("take_"+id); if(b){b.classList.add("done");b.textContent="✓ "+L("Записано","Logged")}
  toast(`${esc(S.meds[id].name)} — ${fmtTime(at)}`,()=>undoDoses([d.id]));
}
function takeCombo(cid,at=Date.now(),note=""){
  const c=S.combos[cid]; if(!c) return;
  const ids=c.medIds.filter(id=>S.meds[id]).map(id=>logDose(id,at,{comboId:cid,...(note?{note}:{})}).id);
  toast(`${esc(c.name)}: ${ids.length} ${pl(ids.length,["препарат","препарати","препаратів"],["medication","medications"])} ${L("о","at")} ${fmtTime(at)}`,()=>undoDoses(ids));
}
function undoDoses(ids){
  ids.forEach(id=>{const d=S.doses[id]; if(!d) return; const m=S.meds[d.medId];
    if(m&&m.stock!==""&&m.stock!=null) put("med",{...m,stock:+(+m.stock+(+d.amount||1)).toFixed(2)});
    del("dose",id)});
  toast(L("Скасовано","Undone"));
}
function askDelete(id){
  if(pendingDelete===id){pendingDelete=null; undoDoses([id]); return}
  pendingDelete=id; render(); setTimeout(()=>{if(pendingDelete===id){pendingDelete=null;render()}},3500);
}
function setFilter(f){histFilter=f;render()}

/* ---------- sheets ---------- */
function openSheet(html){
  closeSheet();
  const v=document.createElement("div"); v.className="veil"; v.id="veil";
  let title="";html=html.replace(/^\s*<h3>([\s\S]*?)<\/h3>/,(_,t)=>{title=t;return ""});
  v.innerHTML=`<div class="sheet"><div class="shead"><div class="grab"></div><div class="srow"><h3>${title}</h3><button type="button" class="sx" data-close aria-label="${L("Закрити","Close")}">✕</button></div></div>${html}</div>`;
  v.addEventListener("click",e=>{if(e.target===v)closeSheet()});
  v.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  const sh=v.querySelector(".sheet");let y0=null,dy=0;
  sh.addEventListener("touchstart",e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null;dy=0;sh.style.transition="none"},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0&&sh.scrollTop<=0){sh.style.transform=`translateY(${dy}px)`}else{dy=0;sh.style.transform=""}},{passive:true});
  sh.addEventListener("touchend",()=>{sh.style.transition="transform .2s";if(dy>110){sh.style.transform="translateY(100%)";setTimeout(closeSheet,180)}else sh.style.transform="";y0=null});
  document.body.appendChild(v); return v;
}
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function confirmDelete(zone,text,onYes){
  const old=zone.innerHTML;
  zone.innerHTML=`<div class="confirm"><p>${text}</p><div class="actions"><button type="button" class="btn ghost" style="flex:1" data-no>${L("Ні, залишити","No, keep")}</button><button type="button" class="btn delbtn" data-yes>${L("Так, видалити","Yes, delete")}</button></div></div>`;
  zone.querySelector("[data-no]").onclick=()=>{zone.innerHTML=old;bindDel()};
  zone.querySelector("[data-yes]").onclick=onYes;
  zone.scrollIntoView({block:"end",behavior:"smooth"});
  let bindDel=()=>{};return f=>{bindDel=f};
}

    <label class="f"><span>${L("Які дні вихідні","Which days are weekends")}</span><div class="row" style="flex-wrap:wrap;gap:6px">${days.map(([l,d])=>`<label class="fbtn daychk"><input type="checkbox" name="we" value="${d}" ${st.weekend.map(Number).includes(d)?"checked":""}>${l}</label>`).join("")}</div></label>
    <button class="btn" style="width:100%">${L("Зберегти","Save")}</button></form>`);
  v.querySelector("#sf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    S.settings={wdWake:f.get("wdWake")||DEF.wdWake,wdSleep:f.get("wdSleep")||DEF.wdSleep,weWake:f.get("weWake")||DEF.weWake,weSleep:f.get("weSleep")||DEF.weSleep,weekend:f.getAll("we").map(Number)};
    saveLocal();closeSheet();render();toast(L("Розпорядок збережено","Routine saved"))};
}

let planView="today";
function renderPlan(){
  const tabs=[["today",L("Сьогодні","Today")],["wd",WD()],["we",WE()]];
  let h=`<div class="filter">${tabs.map(([k,l])=>`<button class="fbtn ${planView===k?"on":""}" onclick="planView='${k}';render()">${l}</button>`).join("")}<button class="fbtn" onclick="openSettings()">⏰ ${L("Розпорядок","Routine")}</button></div>`;
  if(!S.settings) h+=`<div class="card" style="margin-top:14px"><div class="name" style="font-size:19px">${L("Спершу — ваш розпорядок","First, your routine")}</div><p class="sub">${L("Коли ви прокидаєтесь і лягаєте спати в будні та на вихідних. Тоді додаток підбере зручні години.","When you wake up and go to bed on weekdays and weekends — then the app can suggest good times.")}</p><button class="btn" style="width:100%" onclick="openSettings()">${L("Вказати розпорядок","Set routine")}</button></div>`;
  const planned=medsList().filter(hasPlan);
  if(!planned.length) return h+`<div class="empty"><div class="big">${logo(80)}</div>${L("Ще немає ліків із розкладом.","No scheduled medications yet.")}<br>${L("Відкрийте «Мої ліки» → «Змінити» → розділ «Розклад».","Open “My meds” → “Edit” → “Schedule”.")}</div>`;
  const isToday=planView==="today", type=isToday?typeOf(new Date()):planView, P=planCache(type), c=P.c, now=Date.now();
  h+=`<div class="dayhead"><b>${isToday?L("Сьогодні","Today"):type==="we"?L("Вихідний день","Weekend day"):L("Будній день","Weekday")}</b><span class="sub">${type==="we"?L("вихідний","weekend"):L("будній","weekday")} · ${fm(c.wake)}–${fm(c.sleep)}</span></div><div class="timeline" style="padding:0">`;
  let woke=false,slept=false;
  const wakeM=`<div class="mark">☀️ <b>${fm(c.wake)}</b> · ${L("прокидаюсь","wake up")}</div>`;
  const sleepM=`<div class="mark">🌙 <b>${fm(c.sleep)}</b> · ${L("сон","bedtime")}</div>`;
  P.items.forEach(it=>{
    if(!woke&&it.rel>=180){woke=true;h+=wakeM}
    if(!slept&&it.rel>180+c.len){slept=true;h+=sleepM}
    let status="";
    if(isToday){const ts=startOfDay()+it.t*60000,tol=tolOf(it.m);const d=dosesOf(it.m.id).find(x=>Math.abs(x.at-ts)<=tol);
      status=d?`<span class="tag ok">✓ ${fmtTime(d.at)}</span>`:now>ts+tol?`<span class="sub">${L("не відмічено","not logged")}</span>`:now>=ts-20*60000?`<button class="btn small" onclick="takeMed('${it.m.id}')">${TOOK()}</button>`:""}
    const iss=issueText(it);
    h+=`<div class="ev" style="--c:${it.m.color}"><span class="t">${fm(it.t)}</span><span class="d"></span><div><div style="font-weight:700">${esc(it.m.name)}</div>${it.m.dose?`<div class="gap">${esc(it.m.dose)}</div>`:""}${iss?`<div class="gap" style="color:var(--warn)">⚠ ${iss}</div>`:""}</div><div>${status}</div></div>`;
  });
  if(!woke) h+=wakeM;
  if(!slept) h+=sleepM;
  h+=`</div><p class="hint" style="margin:12px 4px">${L("Чи потрібні суворі інтервали саме для ваших ліків, і скільки часу між ними — уточніть у лікаря або фармацевта.","Whether your medications need strict intervals, and how far apart — check with your doctor or pharmacist.")}</p>`;
  return h;
}

function openRefill(id){
  const m=S.meds[id];
  const v=openSheet(`<h3>${L("Поповнити запас","Refill")}</h3><p class="sub" style="margin-top:-8px">${esc(m.name)} · ${L("зараз","now")} ${m.stock===""||m.stock==null?L("не вказано","not set"):pieces(m.stock)}</p>
  <form id="rf"><label class="f"><span>${L("Скільки пігулок додати","How many pills to add")}</span><input class="inp" name="n" type="number" min="0" step="0.5" inputmode="decimal" required autofocus placeholder="${L("напр. 30","e.g. 30")}"></label>
  <button class="btn" style="width:100%">${L("Додати","Add")}</button></form>`);
  v.querySelector("#rf").onsubmit=e=>{e.preventDefault();const n=+new FormData(e.target).get("n")||0;
    put("med",{...m,stock:+((+m.stock||0)+n).toFixed(2)});closeSheet();toast(`${L("Запас","Stock")}: ${pieces((+m.stock||0)+n)}`)};
}

function openComboForm(id){
  const c=id?S.combos[id]:{name:"",medIds:[]};
  const v=openSheet(`<h3>${id?L("Змінити комбінацію","Edit combo"):L("Нова комбінація","New combo")}</h3>
  <form id="cf"><label class="f"><span>${L("Назва","Name")}</span><input class="inp" name="name" required value="${esc(c.name)}" placeholder="${L("напр. Ранок, Вечір, Після їжі","e.g. Morning, Evening, After food")}"></label>
  <label class="f"><span>${L("Що входить","Includes")}</span><div class="checks">${medsList().map(m=>`<label class="check"><input type="checkbox" name="m" value="${m.id}" ${c.medIds.includes(m.id)?"checked":""}><span class="dot on" style="--c:${m.color}"></span>${esc(m.name)}</label>`).join("")}</div></label>
  <div class="actions"><button type="button" class="btn ghost" style="flex:1" data-close2>${L("Скасувати","Cancel")}</button><button class="btn">${L("Зберегти","Save")}</button></div>
  ${id?`<div id="delZone" class="delzone"><button type="button" class="link" style="color:var(--warn)" id="delC">${L("Видалити комбінацію","Delete combo")}</button></div>`:""}</form>`);
  v.querySelectorAll("[data-close2]").forEach(b=>b.onclick=closeSheet);
  const bindCDel=()=>{const dc=v.querySelector("#delC");if(!dc)return;
    dc.onclick=()=>confirmDelete(v.querySelector("#delZone"),L(`Видалити комбінацію «${esc(c.name)}»? Самі ліки залишаться.`,`Delete combo “${esc(c.name)}”? The medications stay.`),()=>{del("combo",id);closeSheet();toast(L("Комбінацію видалено","Combo deleted"))})(bindCDel)};
  bindCDel();
  v.querySelector("#cf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const ids=f.getAll("m");
    if(!ids.length){toast(L("Оберіть хоча б одні ліки","Pick at least one medication"));return}
    put("combo",{...(id?c:{id:uid("c"),created:Date.now()}),name:f.get("name").trim(),medIds:ids});closeSheet();toast(L("Комбінацію збережено","Combo saved"))};
}

function openTimeSheet(kind,id){
  const label=kind==="med"?S.meds[id].name:S.combos[id].name;
  const v=openSheet(`<h3>${L(`Коли ${gx("прийняла","прийняв","прийнято")}?`,"When did you take it?")}</h3><p class="sub" style="margin-top:-8px">${esc(label)}</p>
  <form id="tf"><label class="f"><span>${L("Дата і час","Date and time")}</span><input class="inp" type="datetime-local" name="at" value="${toLocalInput(Date.now())}" max="${toLocalInput(Date.now()+60000)}"></label>
  <div class="row" style="gap:8px;margin:-4px 0 14px;flex-wrap:wrap">${[15,30,60,120].map(n=>`<button type="button" class="fbtn" data-ago="${n}">${L((n<60?n+" хв":n/60+" год")+" тому",(n<60?n+" min":n/60+" h")+" ago")}</button>`).join("")}</div>
  <label class="f"><span>${L("Нотатка (необов'язково)","Note (optional)")}</span><input class="inp" name="note" placeholder="${L("напр. з їжею","e.g. with food")}"></label>
  <button class="btn" style="width:100%">${L("Записати","Log it")}</button></form>`);
  const inp=v.querySelector("[name=at]");
  v.querySelectorAll("[data-ago]").forEach(b=>b.onclick=()=>{inp.value=toLocalInput(Date.now()-b.dataset.ago*60000)});
  v.querySelector("#tf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    const at=new Date(f.get("at")).getTime()||Date.now(); const note=(f.get("note")||"").trim();
    closeSheet(); kind==="med"?takeMed(id,at,note):takeCombo(id,at,note)};
}

/* ---------- backup ---------- */
const BK="mylikiv1_lastbackup";
function markBackup(){try{localStorage.setItem(BK,Date.now())}catch(e){} toast(L("Копію збережено","Backup saved")); render()}
async function saveBackup(){
  const txt=JSON.stringify({app:"moi-liky",v:1,savedAt:Date.now(),data:S});
  const name=`moi-liky-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([txt],name,{type:"application/json"});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:L("Мої ліки — копія","My Meds — backup")}); return markBackup() } }
  catch(e){ if(e&&e.name==="AbortError") return }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); markBackup();
}
function restoreFrom(text){
  let j; try{j=JSON.parse(text)}catch(e){return toast(L("Не вдалося прочитати копію","Couldn't read the backup"))}
  const d=(j&&j.data)||j;
  if(!d||typeof d.meds!=="object") return toast(L("Це не схоже на копію «Мої ліки»","This doesn't look like a My Meds backup"));
  S.meds=d.meds||{}; S.doses=d.doses||{}; S.combos=d.combos||{}; if(d.settings) S.settings=d.settings; if(d.profile) S.profile=d.profile;
  saveLocal(); applyLook(); closeSheet(); render(); toast(L("Дані відновлено","Data restored"));
}
function openRestore(){
  const v=openSheet(`<h3>${L("Відновити з копії","Restore from backup")}</h3>
  <p class="sub" style="margin-top:-8px">${L("Поточні дані на цьому телефоні буде замінено даними з копії.","Current data on this phone will be replaced with the backup.")}</p>
  <label class="f"><span>${L("Файл копії (.json)","Backup file (.json)")}</span><input class="inp" type="file" accept=".json,application/json,text/plain" id="rfile"></label>
  <label class="f"><span>${L("…або вставте скопійований текст","…or paste copied text")}</span><textarea class="inp" id="rtext" rows="4" placeholder="{&quot;app&quot;:&quot;moi-liky&quot; …}"></textarea></label>
  <button class="btn" style="width:100%" id="rgo">${L("Відновити","Restore")}</button>`);
  v.querySelector("#rgo").onclick=async()=>{
    const f=v.querySelector("#rfile").files[0];
    if(f) return restoreFrom(await f.text());
    const t=v.querySelector("#rtext").value.trim();
    if(t) return restoreFrom(t);
    toast(L("Оберіть файл або вставте текст","Choose a file or paste the text"));
  };
}

/* ---------- toast ---------- */
let tt;
function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(t=>t.remove()); clearTimeout(tt);
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=`<span>${msg}</span>`;
  if(undo){const b=document.createElement("button");b.textContent=L("Скасувати","Undo");b.onclick=()=>{t.remove();undo()};t.appendChild(b)}
  document.body.appendChild(t); tt=setTimeout(()=>t.remove(),undo?5000:2200);
}

/* ---------- boot ---------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;pendingDelete=null;closeSheet();render();scrollTo(0,0)});
setInterval(()=>{ if(!$("#veil")) render() },30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#veil"))render()});
initStorage();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
</script>
